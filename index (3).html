<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Mi Día · Organización</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<script src="jspdf.umd.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#24222a; --muted:#6f6b78; --line:#e6e2da;
  --trabajo:#14897a; --trabajo-s:#e2f3f0;
  --oposicion:#6b4fc8; --oposicion-s:#ece8fa;
  --casa:#c9821a; --casa-s:#fbf0dd;
  --red:#c8433a; --green:#2e8b57;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{font-size:1.45rem;margin:0;font-weight:800}
header.top .date{color:var(--muted);font-weight:600;font-size:.95rem}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.sync.ok .dot{background:var(--green)} .sync.local .dot{background:#d9a400}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .sub{font-weight:600;color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:14px}
@media(min-width:820px){.grid.two{grid-template-columns:1.2fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.grid.three{grid-template-columns:repeat(3,1fr);gap:10px}
.area-card{border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent}
.area-card .n{font-size:1.6rem;font-weight:800;line-height:1}
.area-card .l{font-size:.8rem;font-weight:700;margin-top:4px}
.area-card .x{font-size:.75rem;color:var(--muted);margin-top:2px}
.a-trabajo{background:var(--trabajo-s);color:var(--trabajo)}
.a-oposicion{background:var(--oposicion-s);color:var(--oposicion)}
.a-casa{background:var(--casa-s);color:var(--casa)}
.next{border-left:6px solid var(--oposicion);background:linear-gradient(90deg,#fff, #fff)}
.next .t{font-size:1.25rem;font-weight:800;margin:4px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--ink);color:#fff;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#efece6;color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.danger{background:#fbe9e7;color:var(--red)}
.btn.full{width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:2.5px solid #c9c4ba;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check.on::after{content:"✓";font-weight:800;font-size:.9rem}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .tt{font-weight:700;line-height:1.3}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.78rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-weight:700;font-size:.75rem}
.pill.p3{background:#fbe9e7;color:var(--red)}
.pill.late{background:var(--red);color:#fff}
.focusbtn{flex:none;font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:10px;background:#f1eefb;color:var(--oposicion)}
.empty{color:var(--muted);font-size:.92rem;padding:8px 2px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 8px;border-radius:10px;min-width:60px}
nav.bottom button .i{font-size:1.3rem;line-height:1}
nav.bottom button.on{color:var(--ink);background:#efece6}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;display:flex;flex-direction:column;gap:10px}
.fab button{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;font-size:1.7rem;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.fab button.cap{background:#fff;color:var(--ink);font-size:1.4rem;width:50px;height:50px;align-self:flex-end}
.seg{display:flex;background:#ebe7df;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.block{border-radius:14px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.block-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;cursor:pointer}
.block-h .c{font-size:.8rem;color:var(--muted);font-weight:700}
.block-b{padding:0 14px 12px}
.addline{display:flex;gap:8px;margin-top:8px}
.addline input{flex:1}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin:10px 0 4px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,25,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:1.15rem;font-weight:800}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two-col>div{min-width:0}
.prio{display:flex;gap:6px}
.prio button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:.85rem}
.prio button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.subl{display:flex;align-items:center;gap:8px;padding:5px 0}
.subl input[type=text]{min-height:38px;padding:7px 10px}
.x{color:var(--muted);font-size:1.1rem;padding:4px 8px}
/* Focus */
.focus-wrap{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.focus-task{font-size:1.5rem;font-weight:800;max-width:640px;margin:8px 0 4px}
.ring{position:relative;width:min(72vw,320px);height:min(72vw,320px);margin:18px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2.6rem,12vw,4rem);font-weight:800;font-variant-numeric:tabular-nums}
.durs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 14px}
.durs button{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;background:#fff}
.durs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.focus-subs{text-align:left;max-width:460px;width:100%;margin-top:8px}
/* temario */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.tema{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;border:2px solid transparent;position:relative}
.tema .r{font-size:.6rem;font-weight:700;opacity:.8}
.tema.due{border-color:var(--red)}
.st0{background:#efece6;color:#8b8678}.st1{background:#e9e3fb;color:#5a3fb8}.st2{background:#d5cbf6;color:#4a2fa6}.st3{background:#9d86e6;color:#fff}.st4{background:#5b3fc0;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;font-size:.75rem;font-weight:700}
.legend span{padding:3px 8px;border-radius:8px}
.bar{height:10px;border-radius:99px;background:#ece8e0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.stat{font-size:1.4rem;font-weight:800}
.stat-l{font-size:.78rem;color:var(--muted);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.days button{padding:8px 2px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:.75rem;font-weight:700;line-height:1.2}
.days button.today{border-color:var(--casa);background:var(--casa-s);color:#8a5608}
.days button.sel{outline:3px solid var(--ink)}
.streak{font-weight:800;color:#d2560f}
.goal{padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:34px;height:34px;border-radius:10px;background:#efece6;font-weight:800;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast button{color:#ffd88a;font-weight:800}
.hint{font-size:.82rem;color:var(--muted);line-height:1.45}
.inbox-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:0}
.inbox-item .tx{flex:1;font-weight:600}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.celebrate i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
a.link{color:var(--oposicion);font-weight:700}
.focus-mode nav.bottom,.focus-mode .fab{display:none}
.focus-mode .wrap{padding-bottom:30px}
nav.bottom button{min-width:0;flex:1;padding:4px 2px}
.recbtn{background:var(--red)!important;color:#fff!important}
.recbtn:disabled{opacity:.45}
.recpill{color:var(--red);font-weight:800;font-size:.85rem;white-space:nowrap}
.recon{outline:3px solid var(--red)}
#recbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;background:#24222a;color:#fff;border-radius:99px;padding:6px 8px 6px 14px;display:none;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:94vw}
#recbar .rt{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85;font-size:.85rem}
#recbar button{background:#ffffff22;color:#fff;border-radius:99px;min-width:40px;height:40px;padding:0 12px;font-weight:800}
.recdot{width:12px;height:12px;border-radius:50%;background:#ff5a4a;animation:lat 1s infinite;flex:none}.recdot.paused{animation:none;background:#d9a400}
@keyframes lat{50%{opacity:.25}}
body.recording .fab{bottom:calc(140px + env(safe-area-inset-bottom))}
textarea.big{min-height:200px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:.9rem;margin:6px 0}
.chk input{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:var(--trabajo-s);color:var(--trabajo);border-radius:99px;padding:3px 4px 3px 12px;font-weight:700;font-size:.88rem;display:flex;align-items:center}
.chips span button{color:var(--trabajo);font-size:1.1rem;min-width:30px;min-height:30px}
.aud{padding:8px 0;border-bottom:1px solid var(--line)}.aud:last-child{border-bottom:0}
.aud audio{width:100%;margin:6px 0}
.opc{display:grid;gap:8px;margin-top:12px}.opc .btn{justify-content:flex-start}
.dict.on{background:var(--red);color:#fff}
.sync{cursor:pointer}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{flex:1;text-align:center;margin:0;font-size:1.15rem;font-weight:800}
.cal-nav{width:48px;height:48px;border-radius:12px;background:#efece6;font-size:1.4rem;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:2px 0}
.cal-day{min-height:54px;border-radius:10px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;font-weight:700;font-size:.92rem;gap:4px;min-width:0}
.cal-day.out{opacity:.4}
.cal-day.today{border-color:var(--casa);background:var(--casa-s)}
.cal-day.sel{outline:3px solid var(--ink)}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
.cal-dots i{width:7px;height:7px;border-radius:50%;display:block}
nav.bottom button{font-size:.66rem}
nav.bottom button .i{font-size:1.2rem}
.tema.sel{box-shadow:0 0 0 2.5px #d99a00 inset}
.tema.sel::after{content:"★";position:absolute;top:1px;right:4px;font-size:.62rem;color:#d99a00}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom" id="nav"></nav>
<div class="fab" id="fab">
  <button class="cap" title="Volcado rápido" onclick="openCapture()">⚡</button>
  <button title="Nueva tarea" onclick="openTask()">＋</button>
</div>
<div id="layer"></div>
<div id="recbar"></div>

<script>
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); };
const dow = s => { const d=new Date(s+'T12:00:00').getDay(); return d===0?7:d; }; // 1=lunes..7=domingo
const DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_C = ['','L','M','X','J','V','S','D'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => { if(!s) return ''; const d=new Date(s+'T12:00:00'); const t=today();
  if(s===t) return 'Hoy'; if(s===addDays(t,1)) return 'Mañana'; if(s===addDays(t,-1)) return 'Ayer';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); };
const weekKey = s => { const d=new Date((s||today())+'T12:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return dstr(d); };
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);

/* ============ Estado por defecto ============ */
const AREAS = {
  trabajo:{name:'Trabajo',emoji:'🏫',color:'var(--trabajo)'},
  oposicion:{name:'Oposición',emoji:'📚',color:'var(--oposicion)'},
  casa:{name:'Casa',emoji:'🏠',color:'var(--casa)'}
};
function defaultBloques(n){
  const k=4, size=Math.ceil(n/k), out=[];
  for(let i=0;i<k;i++){ const from=i*size+1, to=Math.min(n,(i+1)*size); if(from<=n) out.push({id:uid(),name:'Bloque '+['I','II','III','IV','V','VI'][i],from,to}); }
  return out;
}
function defaultIntervs(){ const a=[]; for(let i=1;i<=12;i++) a.push({id:uid(),n:i,title:'',st:0,notes:'',fuentes:[]}); return a; }
function defaultState(){
  const temas=[]; for(let i=1;i<=68;i++) temas.push({n:i,title:'',st:0,reps:0,next:''});
  return {
    v:1, v2:true, updatedAt:0,
    blocks:{
      trabajo:[
        {id:'evp',name:'Evaluaciones psicopedagógicas'},{id:'inf',name:'Informes y dictámenes'},
        {id:'eoa',name:'Coordinación EOA (PT, AL, PSC, ATE)'},{id:'fam',name:'Familias y tutorías'},
        {id:'acnee',name:'Planes de trabajo ACNEE'},{id:'adm',name:'Gestiones y documentación'},{id:'reun',name:'Reuniones y acuerdos'}],
      oposicion:[
        {id:'tem',name:'Temario'},{id:'prog',name:'Programación'},
        {id:'sup',name:'Supuestos prácticos'},{id:'interv',name:'Intervenciones'},{id:'oral',name:'Exposición y defensa oral'}],
      casa:[{id:'zona',name:'Limpieza por zonas'},{id:'rec',name:'Compras y recados'},{id:'otros',name:'Otros de casa'}]
    },
    tasks:[], inbox:[], sessions:[], reuniones:[],
    goals:[
      {id:uid(),area:'oposicion',text:'Sesiones de foco de oposición',target:5,prog:{}},
      {id:uid(),area:'oposicion',text:'Temas repasados',target:4,prog:{}},
      {id:uid(),area:'oposicion',text:'Supuesto práctico completo',target:1,prog:{}},
      {id:uid(),area:'trabajo',text:'Cerrar informes pendientes',target:2,prog:{}}
    ],
    opo:{
      examDate:'2027-06-20', exam2Date:'2027-06-30', temas, bloques:defaultBloques(68), intervs:defaultIntervs(),
      prog:[
        'Justificación y marco normativo','Contexto del centro','Objetivos','Ámbitos y programas de actuación',
        'Plan de atención a la diversidad / inclusión','Plan de acción tutorial','Orientación académica y profesional',
        'Coordinación interna y externa','Evaluación del plan','Situaciones de aprendizaje / unidades','Bibliografía y referencias','Revisión final y formato'
      ].map(t=>({id:uid(),t,st:0})),
      supuestos:[], orales:[]
    },
    casa:{
      zonas:{
        1:{nombre:'Cocina',items:['Encimera y fogones','Microondas y horno','Fregar suelo']},
        2:{nombre:'Baños',items:['Lavabo y espejo','Inodoro','Ducha o bañera','Suelo']},
        3:{nombre:'Dormitorios',items:['Cambiar sábanas','Polvo','Ordenar armario 10 min']},
        4:{nombre:'Salón',items:['Polvo de muebles','Ordenar superficies','Aspirar sofá']},
        5:{nombre:'Suelos y entrada',items:['Aspirar toda la casa','Fregar','Entrada y zapatero']},
        6:{nombre:'Ropa',items:['Lavadoras pendientes','Doblar y guardar','Plancha (20 min)']},
        7:{nombre:'Descanso y planificación',items:['Planificar la semana en la app','Lista de la compra']}
      },
      minimos:['Platos y cocina recogida','Recoger 10 minutos','Poner o tender una lavadora'],
      log:{}
    },
    rutinas:[
      {id:'man',name:'Mañana',emoji:'☀️',items:['Mirar el plan de hoy en la app','Elegir las 3 tareas clave','Preparar bolso y material']},
      {id:'noc',name:'Noche',emoji:'🌙',items:['Volcado: apuntar todo lo pendiente','Ordenar el volcado','Revisar el plan de mañana','Dejar preparada la ropa']}
    ],
    rlog:{},
    settings:{work:25,brk:5,liveTrans:true},
    focus:null,
    drive:{last:'',link:''}
  };
}

/* ============ Persistencia ============ */
let S = null;
let syncMode = 'local'; // 'cloud' | 'local'
let docRef = null, saveTimer = null, lastWritten = 0;
const LS = 'midia_estado_v1';
function lsGet(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }
function save(){
  S.updatedAt = Date.now();
  lsSet(S);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 700);
}
async function pushCloud(){
  if(!docRef) return;
  try{ lastWritten = S.updatedAt; await docRef.set({json:JSON.stringify(S), updatedAt:S.updatedAt}); setSync('cloud'); }
  catch(e){ setSync('local'); }
}
function setSync(m){ syncMode=m; const el=$('#sync'); if(el){ el.className='sync '+(m==='cloud'?'ok':'local'); el.querySelector('span').textContent = m==='cloud'?'Sincronizado':'💾 Copia de seguridad'; } }
function snapData(snap){ if(!snap) return null; if(typeof snap.data==='function') return snap.data(); if(snap.exists===false) return null; return snap; }
function migrate(o){ const d=defaultState(); const wasV2=!!o.v2; for(const k in d){ if(o[k]===undefined) o[k]=d[k]; }
  const op=o.opo;
  for(const k in d.opo){ if(op[k]===undefined) op[k]=d.opo[k]; }
  if(!wasV2){
    if(op.temas.length===75 && op.temas.slice(67).every(t=>!t.title&&!t.st)) op.temas.length=67;
    if(!op.examDate) op.examDate='2027-06-20';
    op.bloques=defaultBloques(op.temas.length);
    if(!o.blocks.oposicion.some(b=>b.id==='interv')) o.blocks.oposicion.splice(3,0,{id:'interv',name:'Intervenciones'});
    o.v2=true;
  }
  if(!o.blocks.trabajo.some(b=>b.id==='reun')) o.blocks.trabajo.push({id:'reun',name:'Reuniones y acuerdos'});
  if(!Array.isArray(o.reuniones)) o.reuniones=[];
  return o; }

async function initCloud(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    docRef = db.collection('data/users/'+id).doc('estado');
    const snap = await Promise.race([docRef.get(), new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
    const data = snapData(snap);
    if(data && data.json){
      const remote = migrate(JSON.parse(data.json));
      if((remote.updatedAt||0) > (S.updatedAt||0)){ S = remote; lsSet(S); render(); }
      else if((S.updatedAt||0) > (remote.updatedAt||0)) await pushCloud();
    } else {
      await pushCloud();
    }
    setSync('cloud');
    if(docRef.onSnapshot){
      docRef.onSnapshot(sn=>{
        const d = snapData(sn); if(!d || !d.json) return;
        if(d.updatedAt && d.updatedAt > (S.updatedAt||0) && d.updatedAt !== lastWritten){
          if($('.sheet')) return; // no interrumpir una edición
          S = migrate(JSON.parse(d.json)); lsSet(S); render();
        }
      }, ()=>{});
    }
  }catch(e){ setSync('local'); }
}

/* ============ Tareas: helpers ============ */
const pending = a => S.tasks.filter(t=>!t.done && (!a || t.area===a));
const isLate = t => t.due && t.due < today() && !t.done;
const blockName = (a,b) => (S.blocks[a]||[]).find(x=>x.id===b)?.name || '';
function sortTasks(arr){
  return arr.slice().sort((x,y)=> (isLate(y)-isLate(x)) || ((y.prio||2)-(x.prio||2)) || ((x.due||'9999').localeCompare(y.due||'9999')) || ((x.time||'99').localeCompare(y.time||'99')));
}
function todayTasks(){ const t=today(); return sortTasks(S.tasks.filter(x=>!x.done && x.due && x.due<=t)); }
function taskRow(t, opts={}){
  const a = AREAS[t.area];
  const subs = t.sub||[]; const sd = subs.filter(s=>s.d).length;
  return `<div class="task ${t.done?'done':''}">
    <button class="check ${t.done?'on':''}" onclick="toggleTask('${t.id}')" aria-label="Completar"></button>
    <div class="body" onclick="openTask('${t.id}')">
      <div class="tt">${esc(t.title)}</div>
      <div class="meta">
        ${opts.showArea!==false?`<span class="pill a-${t.area}">${a.emoji} ${esc(blockName(t.area,t.block)||a.name)}</span>`:''}
        ${t.due?`<span class="pill ${isLate(t)?'late':''}" style="${isLate(t)?'':'background:#efece6'}">${isLate(t)?'Atrasada · ':''}${fmtDate(t.due)}${t.time?' '+t.time:''}</span>`:''}
        ${t.prio===3?'<span class="pill p3">Importante</span>':''}
        ${t.mins?`<span>⏱ ${t.mins} min</span>`:''}
        ${subs.length?`<span>☑ ${sd}/${subs.length}</span>`:''}
      </div>
    </div>
    ${t.done?'':`<button class="focusbtn" onclick="startFocusTask('${t.id}')">🎯 Foco</button>`}
  </div>`;
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; t.doneAt=t.done?today():'';
  if(t.done){ celebrate(); if(t.repeat){ const nt=spawnRepeat(t); if(nt) autoSyncTask(nt); } }
  save(); render();
}
function spawnRepeat(t){
  const base=t.due||today(); let n=null;
  if(t.repeat==='diaria') n=addDays(base,1);
  if(t.repeat==='semanal') n=addDays(base,7);
  if(t.repeat==='laborables'){ n=addDays(base,1); while(dow(n)>5) n=addDays(n,1); }
  if(t.repeat==='mensual'){ const d=new Date(base+'T12:00:00'); d.setMonth(d.getMonth()+1); n=dstr(d); }
  if(!n) return null;
  const nt={...t,id:uid(),done:false,doneAt:'',due:n,calId:'',sub:(t.sub||[]).map(s=>({t:s.t,d:false})),created:Date.now()};
  S.tasks.push(nt); return nt;
}

/* ============ Rutinas ============ */
function rutinaStreak(r){
  let n=0, d=today();
  const full = day => { const l=(S.rlog[day]||{})[r.id]||{}; return r.items.length && r.items.every((_,i)=>l[i]); };
  if(!full(d)) d=addDays(d,-1);
  while(full(d)){ n++; d=addDays(d,-1); }
  return n;
}
function vRutinas(){
  const t=today();
  return `<div class="card"><h2>Rutinas <button class="btn small soft" onclick="editRutinas()">Editar</button></h2>
  ${S.rutinas.map(r=>{ const l=(S.rlog[t]||{})[r.id]||{}; const done=r.items.filter((_,i)=>l[i]).length; const st=rutinaStreak(r);
    return `<div style="margin-bottom:10px"><div class="row"><b>${r.emoji||''} ${esc(r.name)}</b><span class="hint">${done}/${r.items.length}</span><span class="spacer"></span>${st?`<span class="streak">🔥 ${st} día${st>1?'s':''}</span>`:''}</div>
    ${r.items.map((it,i)=>`<div class="task" style="padding:7px 2px"><button class="check ${l[i]?'on':''}" onclick="toggleRut('${r.id}',${i})"></button><div class="body" onclick="toggleRut('${r.id}',${i})"><div class="tt" style="font-weight:600">${esc(it)}</div></div></div>`).join('')}</div>`;}).join('')}
  </div>`;
}
function toggleRut(rid,i){
  const t=today(); S.rlog[t]=S.rlog[t]||{}; S.rlog[t][rid]=S.rlog[t][rid]||{};
  S.rlog[t][rid][i]=!S.rlog[t][rid][i];
  const r=S.rutinas.find(x=>x.id===rid);
  if(r && r.items.every((_,k)=>S.rlog[t][rid][k])) celebrate();
  pruneLogs(); save(); render();
}
function pruneLogs(){ const lim=addDays(today(),-60); for(const k in S.rlog) if(k<lim) delete S.rlog[k]; for(const k in S.casa.log) if(k<lim) delete S.casa.log[k]; }
function editRutinas(){
  sheet(`<h3>Editar rutinas</h3><p class="hint">Un paso por línea. Pocos pasos y muy concretos funcionan mejor.</p>
  ${S.rutinas.map(r=>`<label class="f">${r.emoji||''} Nombre</label><input type="text" data-rn="${r.id}" value="${esc(r.name)}">
   <label class="f">Pasos</label><textarea data-ri="${r.id}">${esc(r.items.join('\n'))}</textarea>
   <button class="btn small danger" style="margin-top:6px" onclick="S.rutinas=S.rutinas.filter(x=>x.id!=='${r.id}');save();editRutinas()">Eliminar rutina</button>`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn soft" onclick="S.rutinas.push({id:uid(),name:'Nueva rutina',emoji:'⭐',items:['Paso 1']});save();editRutinas()">＋ Rutina</button><span class="spacer"></span>
  <button class="btn" onclick="saveRutinas()">Guardar</button></div>`);
}
function saveRutinas(){
  document.querySelectorAll('[data-rn]').forEach(el=>{ const r=S.rutinas.find(x=>x.id===el.dataset.rn); if(r) r.name=el.value.trim()||r.name; });
  document.querySelectorAll('[data-ri]').forEach(el=>{ const r=S.rutinas.find(x=>x.id===el.dataset.ri); if(r) r.items=el.value.split('\n').map(s=>s.trim()).filter(Boolean); });
  save(); closeSheet(); render();
}

/* ============ Metas semanales ============ */
function vMetas(){
  const wk=weekKey();
  return `<div class="card"><h2>Metas de la semana <button class="btn small soft" onclick="editGoal()">＋ Meta</button></h2>
  ${S.goals.length? S.goals.map(g=>{ const v=(g.prog||{})[wk]||0; const pc=Math.min(100,Math.round(v/g.target*100));
    return `<div class="goal"><div class="row"><span class="pill a-${g.area}">${AREAS[g.area].emoji}</span><b style="flex:1;cursor:pointer" onclick="editGoal('${g.id}')">${esc(g.text)}</b>
     <div class="counter"><button onclick="goalStep('${g.id}',-1)">−</button><b>${v}/${g.target}</b><button onclick="goalStep('${g.id}',1)">＋</button></div></div>
     <div class="bar" style="margin-top:8px"><i style="width:${pc}%;background:${AREAS[g.area].color}"></i></div></div>`;}).join('')
   : '<div class="empty">Ponte 2–4 metas medibles para esta semana.</div>'}
  </div>`;
}
function goalStep(id,d){ const g=S.goals.find(x=>x.id===id); const wk=weekKey(); g.prog=g.prog||{}; const before=g.prog[wk]||0; g.prog[wk]=Math.max(0,before+d);
  if(g.prog[wk]===g.target && d>0) celebrate(); save(); render(); }
function editGoal(id){
  const g=id?S.goals.find(x=>x.id===id):{area:'oposicion',text:'',target:3};
  sheet(`<h3>${id?'Editar meta':'Nueva meta semanal'}</h3>
  <label class="f">Ámbito</label><select id="g_a">${Object.keys(AREAS).map(a=>`<option value="${a}" ${g.area===a?'selected':''}>${AREAS[a].emoji} ${AREAS[a].name}</option>`).join('')}</select>
  <label class="f">Meta (algo que se pueda contar)</label><input type="text" id="g_t" value="${esc(g.text)}" placeholder="Ej.: Temas estudiados en 1ª vuelta">
  <label class="f">Objetivo semanal</label><input type="number" id="g_n" min="1" value="${g.target}">
  <div class="row" style="margin-top:16px">${id?`<button class="btn danger" onclick="S.goals=S.goals.filter(x=>x.id!=='${id}');save();closeSheet();render()">Borrar</button>`:''}<span class="spacer"></span>
  <button class="btn" onclick="saveGoal('${id||''}')">Guardar</button></div>`);
}
function saveGoal(id){
  const text=$('#g_t').value.trim(); if(!text) return;
  const o={area:$('#g_a').value,text,target:Math.max(1,+$('#g_n').value||1)};
  if(id) Object.assign(S.goals.find(x=>x.id===id),o); else S.goals.push({id:uid(),prog:{},...o});
  save(); closeSheet(); render();
}

function newBlock(a){

function renameBlock(a,id){

function delBlock(a,id){ S.blocks[a]=S.blocks[a].filter(x=>x.id!==id); S.tasks=S.tasks.filter(t=>!(t.area===a&&t.block===id)); save(); closeSheet(); render(); }

  const t = id? S.tasks.find(x=>x.id===id) : null;
  draft = t? JSON.parse(JSON.stringify(t)) : {id:'',area:preset?.area||(view==='ambitos'?areaTab:'trabajo'),block:preset?.block||'',title:preset?.title||'',due:preset?.due??today(),time:'',mins:0,prio:2,notes:'',sub:[],repeat:''};
  if(!draft.block) draft.block=S.blocks[draft.area][0]?.id||'';
  drawTask(preset?.inboxId);
}
function drawTask(inboxId){
  const d=draft;
  sheet(`<h3>${d.id?'Tarea':'Nueva tarea'}</h3>
  <label class="f">¿Qué hay que hacer?</label><input type="text" id="t_title" value="${esc(d.title)}" placeholder="Verbo + cosa concreta: «Redactar informe de Lucía»">
  <div class="two-col"><div><label class="f">Ámbito</label><select id="t_area" onchange="draft.area=this.value;draft.block=S.blocks[this.value][0]?.id||'';syncDraft();drawTask('${inboxId||''}')">
    ${Object.keys(AREAS).map(a=>`<option value="${a}" ${d.area===a?'selected':''}>${AREAS[a].emoji} ${AREAS[a].name}</option>`).join('')}</select></div>
   <div><label class="f">Bloque</label><select id="t_block" onchange="if(this.value==='__new'){syncDraft();newBlockInline();}">
    ${S.blocks[d.area].map(b=>`<option value="${b.id}" ${d.block===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}<option value="__new">＋ Nuevo bloque…</option></select></div></div>

async function calCreate(ev){

function calEvent(t){

    const iso=d=>dstr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'; ev.startTime=iso(st); ev.endTime=iso(en); ev.overrideReminders=[{method:'popup',minutes:15},{method:'popup',minutes:0}]; }
  else { ev.allDay=true; ev.startTime=day+'T00:00:00'; ev.endTime=addDays(day,1)+'T00:00:00'; ev.overrideReminders=[{method:'popup',minutes:15*60}]; }

function gcalLink(t){
  const p=new URLSearchParams(); p.set('action','TEMPLATE'); p.set('text',(AREAS[t.area]?.emoji||'')+' '+(t.title||'Tarea'));
  const day=(t.due||today()).replace(/-/g,'');
  if(t.time){ const [h,m]=t.time.split(':').map(Number); const st=new Date(2000,0,1,h,m); const en=new Date(st.getTime()+((t.mins||30)*60000));
    const f=d=>pad(d.getHours())+pad(d.getMinutes())+'00';
    const endDay = en.getDate()!==1? (()=>{ return addDays(t.due||today(),1).replace(/-/g,''); })() : day;
    p.set('dates',`${day}T${f(st)}/${endDay}T${f(en)}`); p.set('ctz','Europe/Madrid'); }
  else { p.set('dates',`${day}/${addDays(t.due||today(),1).replace(/-/g,'')}`); }
  const det=[blockName(t.area,t.block), t.notes, ...(t.sub||[]).map(s=>'☐ '+s.t)].filter(Boolean).join('\n');
  if(det) p.set('details',det);
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

/* ============ CALENDARIO ============ */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let calMonth=today().slice(0,7), calSel=today(), calMode='mes';
const gEv={}, gTried={}; let gState='idle', gAt=0; // idle|loading|ok|off|noconn|err
const G_COLOR='#2a7bd4';
function monthShift(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)+' '+y; }
function monthCells(ym){
  const first=ym+'-01'; const start=addDays(first,-(dow(first)-1));
  const c=Array.from({length:42},(_,i)=>addDays(start,i));
  return c[35].slice(0,7)!==ym? c.slice(0,35) : c;
}
function longDate(s){ const x=new Date(s+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}); return x[0].toUpperCase()+x.slice(1); }

/* --- Leer Google Calendar --- */
function normEv(e){
  if(!e||typeof e!=='object') return null;
  const pick=x=>{ if(!x) return ''; if(typeof x==='string') return x; return x.dateTime||x.date||x.startTime||x.time||''; };
  const s=pick(e.start)||e.startTime||e.startDate||''; const en=pick(e.end)||e.endTime||e.endDate||'';
  if(!s) return null;
  const hasTz=v=>/(Z|[+-]\d\d:?\d\d)$/.test(v)&&v.length>10;
  const parts=v=>{ if(!v) return {day:'',time:''}; if(v.length===10) return {day:v,time:''};
    if(hasTz(v)){ const d=new Date(v); return {day:dstr(d),time:pad(d.getHours())+':'+pad(d.getMinutes())}; }
    return {day:v.slice(0,10),time:v.slice(11,16)}; };
  const a=parts(s), b=parts(en);
  const mid=v=>v&&(v.length===10||/T00:00(:00)?$/.test(v.replace(/(Z|[+-]\d\d:?\d\d)$/,'')));
  const allDay=e.allDay===true||s.length===10||(mid(s)&&mid(en)&&en!==s);
  return {id:e.id||e.eventId||'',title:e.summary||e.title||'(sin título)',day:a.day,time:allDay?'':a.time,endDay:b.day||a.day,endTime:allDay?'':b.time,allDay,loc:e.location||''};
}
function evList(r){
  let p=r&&(r.payload!==undefined?r.payload:r);
  if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){ p=[]; } }
  if(Array.isArray(p)) return {arr:p,next:''};
  if(!p||typeof p!=='object') return {arr:[],next:''};
  const q=p.result&&typeof p.result==='object'?p.result:p;
  return {arr:q.events||q.items||p.events||p.items||[],next:q.nextPageToken||p.nextPageToken||''};
}
async function loadG(ym,force){
  if(!force&&gEv[ym]&&Date.now()-gEv[ym].at<300000) return;
  let mcp=null; try{ mcp=window.claude?await claude.use('mcp'):null; }catch(e){}
  if(!mcp){ gState='off'; return redrawCal(); }
  gState='loading'; redrawCal();
  try{
    const first=ym+'-01', next=monthShift(ym,1)+'-01';
    const req={startTime:addDays(first,-7)+'T00:00:00',endTime:addDays(next,7)+'T00:00:00',pageSize:250,orderBy:'startTime'};
    const byDay={}; let tok='', pages=0, total=0;
    do{
      const r=await mcp.callTool('Google Calendar','list_events',tok?{...req,pageToken:tok}:req);
      const {arr,next:nt}=evList(r); tok=nt; pages++;
      arr.forEach(raw=>{ const e=normEv(raw); if(!e) return; total++;
        let d=e.day, last=e.endDay||e.day;
        if(e.allDay&&last>d) last=addDays(last,-1);
        else if(!e.allDay&&last>d&&(e.endTime==='00:00')) last=addDays(last,-1);
        for(let i=0;i<31&&d<=last;i++,d=addDays(d,1)){ (byDay[d]=byDay[d]||[]).push(e); }
      });
    }while(tok&&pages<4);
    gEv[ym]={at:Date.now(),byDay}; gState='ok'; gAt=Date.now();
  }catch(e){ gState=e&&e.code==='server_not_connected'?'noconn':'err'; }
  redrawCal();
}
function gKick(ym){ if(window.claude&&!gEv[ym]&&!gTried[ym]&&gState!=='loading'){ gTried[ym]=1; setTimeout(()=>loadG(ym),60); } }
function gRefresh(){ Object.keys(gTried).forEach(k=>delete gTried[k]); gTried[calMonth]=1; loadG(calMonth,true); toast('Leyendo tu Google Calendar…'); }
function gDrop(id){ Object.values(gEv).forEach(m=>{ for(const d in m.byDay) m.byDay[d]=m.byDay[d].filter(e=>e.id!==id); }); }
function redrawCal(){ if((view==='cal'||view==='hoy')&&!$('.sheet')) render(); }

/* --- Entradas de un día (tareas + Google + examen) --- */
function appCtx(){
  const ids=new Set(S.tasks.map(t=>t.calId).filter(c=>c&&c!=='sí'));
  const keys=new Set(S.tasks.filter(t=>t.calId).map(t=>(t.due||'')+'|'+(AREAS[t.area]?.emoji||'')+' '+t.title));
  return {ids,keys};
}
function gFor(day,ctx){
  const seen=new Set(), out=[];
  Object.values(gEv).forEach(m=>(m.byDay[day]||[]).forEach(e=>{
    const k=(e.id||e.title)+'|'+e.time; if(seen.has(k)) return; seen.add(k);
    if(e.id&&ctx.ids.has(e.id)) return; if(ctx.keys.has(day+'|'+e.title)) return; out.push(e); }));
  return out;
}
function dayEntries(day,ctx){
  const out=[];
  S.tasks.filter(t=>t.due===day).forEach(t=>out.push({k:'t',t,time:t.time||'',done:t.done?1:0}));
  gFor(day,ctx).forEach(e=>out.push({k:'g',e,time:e.time||'',done:0}));
  (S.reuniones||[]).filter(r=>r.fecha===day).forEach(r=>out.push({k:'r',r,time:r.hora||'',done:0}));
  (S.citas||[]).filter(c=>c.day===day).forEach(c=>out.push({k:'c',c,time:c.time||'',done:0}));
  if(S.opo.examDate===day) out.push({k:'x',txt:'📚 Oposición · 1ª parte (examen)',time:'',done:0});
  if(S.opo.exam2Date===day) out.push({k:'x',txt:'🎤 Oposición · 2ª parte (exposición, como muy tarde)',time:'',done:0});
  return out.sort((a,b)=>(a.done-b.done)||a.time.localeCompare(b.time));
}
function entryRow(en){

  if(en.k==='r'){ const r=en.r; return `<div class="task"><span style="font-size:1.3rem">🎙️</span><div class="body" onclick="openReu('${r.id}')"><div class="tt">${esc(r.titulo||'Reunión')}</div>

/* --- Vista Calendario --- */
function calGo(n){

  else { calSel=addDays(calSel,7*n); calMonth=calSel.slice(0,7); }
  render();
}
function calToday(){ calSel=today(); calMonth=calSel.slice(0,7); render(); }
function calPick(d){ calSel=d; calMonth=d.slice(0,7); render(); }
function vCal(){

  let body='';

      ${cells.map(d=>{
        const en=dayEntries(d,ctx); const areas=[...new Set(en.filter(x=>x.k==='t'&&!x.t.done).map(x=>x.t.area))];
        const g=en.some(x=>x.k==='g'), x=en.some(x=>x.k==='x'), rr=en.some(x=>x.k==='r'), cc=en.some(x=>x.k==='c'); const n=en.filter(x=>x.k==='t'&&!x.t.done).length;
        const dots=areas.map(a=>`<i style="background:${AREAS[a].color}"></i>`).join('')+(g?`<i style="background:${G_COLOR}"></i>`:'')+(rr?'<i style="background:#e0567a"></i>':'')+(cc?'<i style="background:var(--ink)"></i>':'')+(x?'<i style="background:var(--red)"></i>':'');
        return `<button class="cal-day ${d.slice(0,7)!==calMonth?'out':''} ${d===t?'today':''} ${d===calSel?'sel':''}" aria-label="${longDate(d)}${n?', '+n+' tareas':''}" onclick="calPick('${d}')">
          <span>${+d.slice(8)}</span><span class="cal-dots">${dots}</span></button>`; }).join('')}</div>
      <div class="legend" style="margin:10px 0 0">${Object.keys(AREAS).map(a=>`<span style="background:#f4f1ea"><b style="color:${AREAS[a].color}">●</b> ${AREAS[a].name}</span>`).join('')}<span style="background:#f4f1ea"><b style="color:var(--ink)">●</b> Cita</span><span style="background:#f4f1ea"><b style="color:#e0567a">●</b> Reunión</span><span style="background:#f4f1ea"><b style="color:${G_COLOR}">●</b> Google</span><span style="background:#f4f1ea"><b style="color:var(--red)">●</b> Examen</span></div>`;
    const en=dayEntries(calSel,ctx); const z=S.casa.zonas[dow(calSel)];
    body=`<div class="card">${head}${grid}</div>
      <div class="card"><h2>${longDate(calSel)}<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn small" onclick="openDayAdd('${calSel}')">＋ Añadir</button><button class="btn small soft" aria-label="Nueva reunión" onclick="newReuDay('${calSel}')">🎙️</button><button class="btn small soft" aria-label="Colocar mis tareas en los huecos" onclick="autoPlanAsk('${calSel}')">🪄</button></span></h2>

async function calMcp(){ const m=window.claude?await claude.use('mcp'):null; if(!m) throw {code:'unavailable'}; return m; }
async function calPush(t){
  const ev=calEvent(t);
  if(t.calId&&t.calId!=='sí'){
    const m=await calMcp();
    await m.callTool('Google Calendar','update_event',{eventId:t.calId,summary:ev.summary,description:ev.description||'',startTime:ev.startTime,endTime:ev.endTime,allDay:!!ev.allDay,overrideReminders:ev.overrideReminders});
    return t.calId;
  }
  const r=await calCreate(ev); const e=r.event||r; return e.id||e.eventId||'sí';
}
async function autoSyncTask(t){
  if(!S.settings.autoCal||!t||!t.due||t.done||t.calId==='sí') return;
  try{ const id=await calPush(t); if(t.calId!==id){ t.calId=id; save(); } toast('📅 Google Calendar al día'); }
  catch(e){ if(!(e&&e.code==='unavailable')) toast('No se pudo actualizar Google Calendar'); }
}
async function autoDeleteEvent(id){

  try{ const m=await calMcp(); await m.callTool('Google Calendar','delete_event',{eventId:id,notificationLevel:'NONE'}); gDrop(id); }catch(e){}
}

/* --- Exportar .ics --- */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(l){ const o=[]; while(l.length>72){ o.push(l.slice(0,72)); l=' '+l.slice(72); } o.push(l); return o.join('\r\n'); }
function buildICS(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mi Dia//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Mi Día'];
  const add=(uid,title,desc,day,time,mins,alarm)=>{
    L.push('BEGIN:VEVENT','UID:'+uid+'@midia',`DTSTAMP:${stamp}`,'SUMMARY:'+icsEsc(title));
    if(desc) L.push('DESCRIPTION:'+icsEsc(desc));
    if(time){ const [h,m]=time.split(':').map(Number); const st=new Date(day+'T12:00:00'); st.setHours(h,m,0,0); const en=new Date(st.getTime()+(mins||30)*60000);
      const f=d=>dstr(d).replace(/-/g,'')+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; L.push('DTSTART:'+f(st),'DTEND:'+f(en)); }
    else L.push('DTSTART;VALUE=DATE:'+day.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(day,1).replace(/-/g,''));
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio','TRIGGER:'+alarm,'END:VALARM','END:VEVENT');
  };
  S.tasks.filter(t=>t.due&&!t.done).forEach(t=>{
    const det=[blockName(t.area,t.block),t.notes,...(t.sub||[]).map(s=>'☐ '+s.t)].filter(Boolean).join('\n');
    add(t.id,(AREAS[t.area]?.emoji||'')+' '+t.title,det,t.due,t.time,t.mins,t.time?'-PT15M':'-PT15H'); });
  (S.reuniones||[]).forEach(r=>{ if(r.fecha) add('reu'+r.id,'🎙️ '+(r.titulo||'Reunión'),[REU_TIPOS[r.tipo]?.n,r.lugar].filter(Boolean).join('\n'),r.fecha,r.hora||'',60,r.hora?'-PT15M':'-PT15H'); });
  (S.citas||[]).forEach(c=>{ if(c.day) add('cita'+c.id,'📌 '+c.title,[c.lugar,c.notas].filter(Boolean).join('\n'),c.day,c.time||'',c.mins||60,c.time?'-PT15M':'-PT15H'); });
  if(S.opo.examDate) add('examen1','📚 Oposición · 1ª parte (examen)','',S.opo.examDate,'',0,'-P7D');
  if(S.opo.exam2Date) add('examen2','🎤 Oposición · 2ª parte (exposición) — como muy tarde','',S.opo.exam2Date,'',0,'-P7D');
  L.push('END:VCALENDAR'); return L.map(icsFold).join('\r\n')+'\r\n';
}
async function exportICS(){
  const data=buildICS(), name='mi-dia-calendario.ics'; let ok=false;
  try{ const dl=window.claude?await claude.use('downloads'):null; if(dl){ await dl.save({filename:name,data}); ok=true; } }catch(e){}
  if(!ok){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'text/calendar'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); ok=true; }catch(e){} }
  if(!ok){ try{ await navigator.clipboard.writeText(data); toast('Copiado el contenido del .ics'); return; }catch(e){} }
  toast(ok?'📥 Calendario descargado: ábrelo para importarlo':'No se pudo descargar');
}

function daSave(again){
  daSync(); const d=dadd; const multi=d.multi;
  const lines=(multi?d.title.split(/\r?\n/):[d.title]).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ $('#da_t').focus(); return; }
  let first=null, lastTk=null;
  lines.forEach(line=>{
    const nl=parseNL(line,d.day);
    if(d.kind==='cita'){
      S.citas=S.citas||[];
      const c={id:uid(),title:nl.title,day:nl.day,time:nl.time||(multi?'':d.time)||'',mins:nl.mins||(multi?0:d.mins)||0,lugar:multi?'':(d.lugar||'').trim(),notas:'',created:Date.now()};
      S.citas.push(c); lastTk={due:c.day,time:c.time}; }
    else{
      const ar=nl.area||d.area; const bl=ar===d.area?d.block:(S.blocks[ar][0]?.id||'');
      const tk={id:uid(),area:ar,block:bl,title:nl.title,due:nl.day,time:nl.time||(multi?'':d.time)||'',mins:nl.mins||(multi?0:d.mins)||0,prio:2,done:false,notes:'',sub:[],repeat:'',created:Date.now()};
      S.tasks.push(tk); S.settings.lastArea=ar; autoSyncTask(tk); lastTk=tk; }
    if(!first) first=lastTk.due;
  });
  save();
  const what=d.kind==='cita'?'cita':'tarea';
  const msg=lines.length>1?`Añadidas ${lines.length} ${what}s`:`Añadida: ${fmtDate(lastTk.due).toLowerCase()}${lastTk.time?' a las '+lastTk.time:''}`;
  if(again){ d.title=''; d.time=''; d.mins=0; d.lugar=''; drawDayAdd(); setTimeout(()=>$('#da_t')?.focus(),60); toast(msg); }
  else { closeSheet(); if(first!==calSel){ calSel=first; calMonth=first.slice(0,7); } render(); toast(msg); }
}

function peLabel(code){ // 'T3' -> {n:39,title,txt:'T3 · Tema 39'}
  const res=code[0]==='R'; const arr=res?PE_RES:PE_TEMAS; const it=arr[+code.slice(1)-1];
  return {n:it[0],title:it[1],done:!!it[2],res,txt:`${code} · Tema ${it[0]}`};
}
function peRange(a,b){ const out=[]; for(let i=+a.slice(1);i<=+b.slice(1);i++) out.push('T'+i); return out; }
function peNums(list){ return list.map(c=>peLabel(c).n).join(', '); }
function buildPlanEstudio(){
  const plan=[]; // {day,block,title,mins,sub,notes}
  const B=50, put=(day,o)=>plan.push(Object.assign({day,mins:B,sub:[],notes:''},o));
  const elab=(day,c)=>{ const x=peLabel(c); const base=PE_NOTA[x.n]||'';
    if(x.res) put(day,{block:'tem',title:`${x.txt} (reserva): esquema y frases puente`,mins:2*B,sub:['Esquema de 3 páginas como máximo','Frases puente, introducción y conclusión'],notes:base});
    else if(x.done) put(day,{block:'tem',title:`${x.txt}: revisar el tema ya hecho`,mins:2*B,sub:['Revisar contenido y normativa','Esquema de 1 página, frases puente y mnemotecnia'],notes:'Ya elaborado: solo revisión.'});
    else put(day,{block:'tem',title:`${x.txt}: elaborar y esquema`,mins:2*B,sub:['Elaborar o adaptar el tema con tu formato fijo','Esquema de 1 página, frases puente y mnemotecnia'],notes:base});
  };
  const memo=(day,c)=>{ const x=peLabel(c);
    put(day,{block:'tem',title:`${x.txt}: memorizar`,mins:2*B,sub:['Memorizar en voz alta por apartados (Atril)','Recuperar sin mirar: decirlo entero y escribir solo el esquema','Marcar el tema como «Memorizado» en la app para que programe los repasos'],notes:x.res?'Reserva: introducción, conclusión y esquema.':''});
  };
  const sup=n=>({block:'sup',title:`Supuesto SP${n} (${n%2?'Primaria · EOA':'Secundaria · DO'}): ${PE_TIPOS[(n-1)%8]}`,mins:2*B,sub:['Identificar problemas explícitos e implícitos e hipótesis','Resolver con la plantilla fija, de palabra o dictando'],notes:'Sin escribir a mano. Revisa la proporcionalidad de las medidas.'});
  const sim=t=>({block:/supuesto|completo/i.test(t)?'sup':'tem',title:t,mins:/completo/i.test(t)?240:120,sub:['Condiciones reales y cronometrado (con la adaptación de tiempo si te la conceden)','Corregir con criterios de tribunal y anotar los 3 fallos principales'],notes:/supuesto/i.test(t)?'Formato real: un supuesto de Primaria (EOA) y uno de Secundaria (DO).':''});
  const rep=(day)=>put(day,{block:'tem',title:'Repaso espaciado oral de los temas que toquen',sub:['Pestaña Oposición › Temario: repasos de hoy, 10–15 min por tema']});
  // Semana 0
  put('2026-11-28',{block:'tem',title:'Confirmar en la app los 30 temas elegidos (27 + 3 de reserva)',mins:B});
  put('2026-11-28',{block:'sup',title:'Reunir el banco de supuestos (CLM y otras comunidades) y clasificarlos por tipo',mins:B});
  PE_SEM.forEach(w=>{
    const d=i=>addDays(w.l,i); const L=0,M=1,X=2,J=3,V=4,S=5,D=6;
    const pItem=w.u?{block:'interv',title:`Unidad ${w.u} (Intervención ${w.u}): redactar con la plantilla común`,mins:2*B,sub:['Desarrollo de 4–6 páginas','Ficha de 1 página'],notes:'Apóyala en uno o dos de tus temas.'}:(w.p?{block:'prog',title:w.p,mins:2*B}:null);
    if(w.ult){
      [L,M,X,J].forEach(i=>put(d(i),{block:'tem',title:'Repaso ligero de esquemas',mins:B}));
      put(d(V),{block:'tem',title:'Frases puente y plantilla de supuestos (repaso final)',mins:B});
      return;
    }
    if(w.f||w.g){ // fase de afinado
      if(w.f){ const r=peRange(w.f[0],w.f[1]), h=Math.ceil(r.length/2);
        put(d(L),{block:'tem',title:`Repaso oral de los temas ${peNums(r.slice(0,h))}`,mins:2*B});
        put(d(M),{block:'tem',title:`Repaso oral de los temas ${peNums(r.slice(h))}${w.f[1]==='T27'?' y reserva (48, 62, 16)':''}`,mins:2*B});
      } else { put(d(L),{block:'tem',title:w.g+' (1/2)',mins:2*B}); put(d(M),{block:'tem',title:w.g+' (2/2)',mins:2*B}); }
      put(d(X),{block:'oral',title:w.o,mins:2*B});
      put(d(J),{block:'sup',title:'Supuesto en esquema del banco (30–45 min)',mins:B});
      rep(d(V));
      if(w.x) put(d(S),sim(w.x));
      return;
    }
    if(w.v&&!w.t){ // semana valle
      const r=peRange(w.v[0],w.v[1]), k=Math.ceil(r.length/4), parts=[r.slice(0,k),r.slice(k,2*k),r.slice(2*k,3*k),r.slice(3*k)].filter(p=>p.length);
      const dias=w.p?[L,M,J,V]:[L,M,X,J];
      parts.forEach((p,i)=>put(d(dias[i]),{block:'tem',title:`Semana valle · repaso oral de los temas ${peNums(p)}`,mins:B}));
      if(w.p) put(d(X),{block:'prog',title:w.p,mins:2*B});
      return;
    }
    // semana normal
    const slots={}; const add=(i,o)=>{ (slots[i]=slots[i]||[]).push(o); };
    const [a,b]=w.t;
    add(L,['elab',a]); add(M,['memo',a]);
    let pDay=X;
    if(b){ add(X,['elab',b]); add(V,['memo',b]); pDay=null; } else add(V,['rep']);
    if(w.valleTras){ const r=peRange(w.v[0],w.v[1]), h=Math.ceil(r.length/2);
      add(X,['raw',{block:'tem',title:`Semana valle · repaso oral de los temas ${peNums(r.slice(0,h))}`,mins:B}]);
      add(J,['raw',{block:'tem',title:`Semana valle · repaso oral de los temas ${peNums(r.slice(h))}`,mins:B}]); }
    if(w.s) add(J,['raw',typeof w.s==='number'?sup(w.s):{block:'sup',title:w.s,mins:B}]);
    if(w.x) add(S,['raw',sim(w.x)]);
    if(pItem){ if(pDay===null) pDay=!slots[J]?J:(!slots[S]?S:D); add(pDay,['raw',pItem]); }
    // festivos: se pasan al sábado o al domingo
    Object.keys(slots).map(Number).sort().forEach(i=>{ if(PE_FESTIVOS.includes(d(i))){ const dest=!slots[S]?S:D; slots[dest]=(slots[dest]||[]).concat(slots[i]); delete slots[i]; } });
    Object.keys(slots).forEach(i=>slots[i].forEach(([k,v])=>{ const day=d(+i);
      if(k==='elab') elab(day,v); else if(k==='memo') memo(day,v); else if(k==='rep') rep(day); else put(day,v); }));
  });
  return plan.filter(p=>p.day>=today());
}

function parsePlan(txt){
  const out=[], t=today(), max=S.opo.examDate||'2999-12-31';
  const MAP={tema:'tem',repaso:'tem',simulacro:'tem',supuesto:'sup',programacion:'prog',intervencion:'interv',oral:'oral'};
  const NAME={tema:'Tema',repaso:'Repaso',simulacro:'Simulacro',supuesto:'Supuesto',programacion:'Programación',intervencion:'Intervención',oral:'Oral'};
  (txt||'').split(/\r?\n/).forEach(line=>{
    const l=line.replace(/[*`]/g,'').replace(/^[\s\-•]*(?:\d+[.)]\s*)?(?=\d{4}-\d{2})/,'').trim();
    const m=l.match(/^(\d{4}-\d{2}-\d{2})\s*[|;]\s*(\d{1,2})[:.](\d{2})\s*[|;]\s*(\d{1,3})\s*(?:min\w*)?\s*[|;]\s*([^|;]+?)\s*[|;]\s*(.+)$/i);
    if(!m) return;
    const [,day,hh,mm,mins,tipo0,tarea]=m;
    if(day<t||day>max||+hh>23||+mm>59) return;
    const k=tipo0.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().split(/\s+/)[0];
    const key=MAP[k]?k:'tema';
    const nm=NAME[key]; let title=tarea.trim();
    if(!new RegExp('^'+nm,'i').test(title)) title=nm+': '+title;
    out.push({day,time:pad(+hh)+':'+mm,mins:Math.min(180,Math.max(10,+mins)),block:MAP[key],title});
  });
  const seen=new Set(S.tasks.map(x=>x.due+'|'+x.title));
  return out.filter(x=>{ const k=x.day+'|'+x.title; if(seen.has(k)) return false; seen.add(k); return true; })
            .sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));
}

  const cut=(re)=>{ const m=s.match(re); if(m){ s=s.replace(m[0],' '); } return m; };
  let m;
  if((m=cut(/\s#(trabajo|oposici[oó]n|casa)\b/i))){ area=m[1].toLowerCase().startsWith('opos')?'oposicion':m[1].toLowerCase(); }
  const t0=today();
  if((m=cut(/\bpasado\s+ma[ñn]ana\b/i))) day=addDays(t0,2);
  else if((m=cut(/(?<!la )\bma[ñn]ana\b/i))) day=addDays(t0,1);
  else if((m=cut(/\bhoy\b/i))) day=t0;
  else{
    const W=[['lunes',1],['martes',2],['mi[eé]rcoles',3],['jueves',4],['viernes',5],['s[aá]bado',6],['domingo',7]];
    for(const [re,n] of W){ if((m=cut(new RegExp('\\b(?:el\\s+)?'+re+'\\b','i')))){ const diff=((n-dow(t0))+7)%7||7; day=addDays(t0,diff); break; } }
  }
  if((m=cut(/\ba\s+las?\s+(\d{1,2})(?:[:.h](\d{2}))?\b/i))||(m=cut(/\b(\d{1,2})[:h](\d{2})\b/i))||(m=cut(/\b(\d{1,2})\s?h\b/i))){
    const hh=+m[1], mm=+(m[2]||0); if(hh<=23&&mm<=59) time=pad(hh)+':'+pad(mm); else s+=' '+m[0];
  }
  if((m=cut(/\b(\d{1,3})\s*(?:min|minutos)\b/i))) mins=+m[1];
  else if((m=cut(/\b(\d+(?:[.,]5)?)\s*horas?\b/i))) mins=Math.round(parseFloat(m[1].replace(',','.'))*60);
  let title=s.replace(/\s+/g,' ').replace(/(?:^|\s)(?:para|el|a las|a)\s*$/i,'').replace(/[\s,.;:-]+$/,'').trim();
  if(!title) title=String(raw||'').trim();
  return {title,day,time,mins,area};
}

/* ============ Colocar las tareas del día en los huecos libres ============ */
const toMin=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);
let planProp=null;
function planProposal(day){
  const from=toMin(S.settings.planFrom||'16:30'), to=toMin(S.settings.planTo||'21:00');
  const ctx=appCtx(); const busy=[];
  dayEntries(day,ctx).forEach(e=>{
    if(e.k==='t'&&e.t.time&&!e.t.done) busy.push([toMin(e.t.time),toMin(e.t.time)+(e.t.mins||30)]);
    if(e.k==='r'&&e.r.hora) busy.push([toMin(e.r.hora),toMin(e.r.hora)+60]);
    if(e.k==='c'&&e.c.time) busy.push([toMin(e.c.time),toMin(e.c.time)+(e.c.mins||60)]);
    if(e.k==='g'&&e.e.time) busy.push([toMin(e.e.time),e.e.endTime?toMin(e.e.endTime):toMin(e.e.time)+60]);
  });
  let cur=from; if(day===today()){ const n=new Date(); cur=Math.max(from,Math.ceil((n.getHours()*60+n.getMinutes()+5)/15)*15); }
  const out=[], left=[];
  sortTasks(S.tasks.filter(t=>!t.done&&t.due===day&&!t.time)).forEach(t=>{
    const len=t.mins||30; let c=cur;
    for(let i=0;i<60;i++){ const k=busy.find(b=>c<b[1]&&c+len>b[0]); if(!k) break; c=Math.ceil(k[1]/5)*5; }
    if(c+len<=to){ out.push({id:t.id,title:t.title,area:t.area,time:fromMin(c),end:fromMin(c+len)}); busy.push([c,c+len]); cur=c+len+10; }
    else left.push(t.title);
  });
  return {day,out,left};
}
function autoPlanAsk(day){
  planProp=planProposal(day); const p=planProp;
  sheet(`<h3>🪄 Colocar mis tareas · ${longDate(day)}</h3>
  <p class="hint">Reparte las tareas de este día que no tienen hora en los huecos libres, con 10 min de descanso entre una y otra. Respeta tus reuniones, tareas con hora y eventos.</p>
  <div class="two-col"><div><label class="f">Desde</label><input type="time" id="pl_f" value="${S.settings.planFrom||'16:30'}"></div><div><label class="f">Hasta</label><input type="time" id="pl_t" value="${S.settings.planTo||'21:00'}"></div></div>
  <div class="row" style="margin-top:8px"><button class="btn small soft" onclick="S.settings.planFrom=$('#pl_f').value||'16:30';S.settings.planTo=$('#pl_t').value||'21:00';save();autoPlanAsk('${day}')">Recalcular</button></div>
  <div style="margin-top:10px;max-height:40vh;overflow:auto">${p.out.length?p.out.map(x=>`<div class="task" style="padding:6px 4px"><div class="body"><div class="tt" style="font-size:.95rem">${AREAS[x.area].emoji} ${esc(x.title)}</div><div class="meta"><span>${x.time}–${x.end}</span></div></div></div>`).join(''):'<div class="empty">No hay tareas sin hora en este día (o no caben en la franja).</div>'}
  ${p.left.length?`<div class="hint" style="margin-top:8px">No caben hoy (${p.left.length}): ${p.left.map(esc).join(', ')}. Muévelas a otro día.</div>`:''}</div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Cerrar</button><span class="spacer"></span>${p.out.length?`<button class="btn" onclick="autoPlanApply()">Poner ${p.out.length} horas</button>`:''}</div>`);
}

   ${sel.length?`<button class="btn small soft" onclick="temaOnly=!temaOnly;render()">${temaOnly?'Ver todos':'Ver solo mis temas'}</button><button class="btn small ghost" onclick="clearSel()">Vaciar</button>`:''}</div>
   ${temaMode==='elegir'?'<div class="hint" style="margin-top:8px"><b>Modo elegir:</b> toca un tema para marcarlo ★ o quitarlo.</div>':''}</div>`;
  return ctl+`<div class="card"><h2>Temario <span class="sub">${temaMode==='elegir'?'toca para elegir':'toca un tema para actualizarlo'}</span></h2>
  <div class="legend">${ST_N.map((l,i)=>`<span class="st${i}">${l}</span>`).join('')}<span style="border:2px solid var(--red)">Repaso pendiente</span><span style="background:#fbf0dd;color:#8a5608">★ Mi tema</span></div>
  ${temaGroups().map(g=>{ const ts=o.temas.slice(g.from-1,g.to).filter(x=>!only||sel.includes(x.n)); if(!ts.length) return '';
    const st=ts.filter(x=>x.st>=1).length, dm=ts.filter(x=>x.st>=3).length; const pc=ts.length?Math.round(ts.reduce((a,x)=>a+x.st,0)/(ts.length*4)*100):0;
    return `<div style="margin:14px 0 6px"><div class="row"><b>${esc(g.name)}</b><span class="hint">Temas ${g.from}–${g.to} · ${st} empezados · ${dm} memorizados</span></div>
    <div class="bar" style="margin:6px 0 8px"><i style="width:${pc}%;background:var(--oposicion)"></i></div>
    <div class="temas">${ts.map(x=>`<button class="tema st${x.st} ${x.next&&x.next<=t?'due':''} ${sel.includes(x.n)?'sel':''}" onclick="${temaMode==='elegir'?`toggleSel(${x.n})`:`openTema(${x.n-1})`}" title="${esc(x.title)}">${x.n}${x.reps?`<span class="r">↻${x.reps}</span>`:''}</button>`).join('')}</div></div>`; }).join('')}
  <div class="row" style="margin-top:12px"><button class="btn small soft" onclick="editBloques()">✎ Editar bloques del temario</button><span class="spacer"></span><span class="hint">Nº de temas:</span><input type="number" min="1" max="120" value="${o.temas.length}" style="max-width:90px" onchange="resizeTemas(+this.value)"></div>
  </div>
  <div class="card"><h2>Repasos para hoy <span class="sub">repetición espaciada: 1-3-7-14-30-60 días</span></h2>
  ${due.length? due.map(x=>`<div class="task"><span class="pill a-oposicion">T${x.n}</span><div class="body" onclick="openTema(${x.n-1})"><div class="tt">${esc(x.title||'Tema '+x.n)}</div><div class="meta">Repaso nº ${x.reps+1}${x.next<t?' · atrasado':''}</div></div><button class="focusbtn" onclick="repasar(${x.n-1})">✓ Repasado</button></div>`).join('') : '<div class="empty">Ningún repaso pendiente hoy. Cuando marques un tema como «Memorizado» empezará a programar repasos.</div>'}
  </div>`;
}

/* ============ Programación didáctica ============ */
const PP={ses:2,fin:false};
function progStats(){ const p=S.opo.prog; return {d:p.filter(x=>x.st===2).length,w:p.filter(x=>x.st===1).length,n:p.length}; }
function vProg(){
  const lab=['Pendiente','En curso','Terminada']; const o=S.opo, st=progStats();
  const pc=st.n?Math.round((st.d*2+st.w)/(st.n*2)*100):0;
  return `<div class="card" style="border-left:6px solid var(--oposicion)"><h2>Programación didáctica <span class="sub">${st.d}/${st.n} terminados</span></h2>
  <div class="bar" style="margin:2px 0 10px"><i style="width:${pc}%;background:var(--oposicion)"></i></div>
  <div class="two-col"><div><label class="f">Quiero tenerla terminada el</label><input type="date" value="${o.progDate||''}" onchange="S.opo.progDate=this.value;save();render()"></div>
   <div><label class="f">Plan automático</label><button class="btn full" onclick="progPlanAsk()">🪄 Repartir en el calendario</button></div></div>
  ${o.progDate?`<div class="hint" style="margin-top:8px">Faltan ${Math.max(0,daysBetween(today(),o.progDate))} días y quedan ${st.n-st.d} apartados.</div>`:'<div class="hint" style="margin-top:8px">Pon una fecha objetivo y la app reparte los apartados pendientes por tu calendario.</div>'}</div>
  <div class="card"><h2>Apartados <span class="sub">toca el estado para cambiarlo</span></h2>
  ${o.prog.map((p,i)=>`<div class="task"><span class="pill" style="background:${['#efece6','#ece8fa','#dff2e6'][p.st]};color:${['#8b8678','var(--oposicion)','var(--green)'][p.st]};cursor:pointer;min-width:84px;justify-content:center" onclick="S.opo.prog[${i}].st=(S.opo.prog[${i}].st+1)%3;if(S.opo.prog[${i}].st===2)celebrate();save();render()">${lab[p.st]}</span>
   <div class="body"><input type="text" value="${esc(p.t)}" style="border:0;padding:4px;min-height:32px;font-weight:700" onchange="S.opo.prog[${i}].t=this.value;save()"></div>
   <button class="x" title="Crear tarea" onclick="openTask(null,{area:'oposicion',block:'prog',title:'Programación: '+S.opo.prog[${i}].t})">📅</button>
   <button class="x" onclick="S.opo.prog.splice(${i},1);save();render()">✕</button></div>`).join('')}
  <div class="addline"><input type="text" id="np" placeholder="Añadir apartado" onkeydown="if(event.key==='Enter'&&this.value.trim()){S.opo.prog.push({id:uid(),t:this.value.trim(),st:0});save();render()}"></div></div>`;
}
function progPlan(){
  const o=S.opo, end=o.progDate||'', pend=o.prog.filter(p=>p.st!==2);
  const days=[]; if(end) for(let d=addDays(today(),1);d<=end;d=addDays(d,1)){ if(PP.fin||dow(d)<=5) days.push(d); }
  const items=[];
  for(let s=1;s<=PP.ses;s++) pend.forEach(p=>{
    const verb=PP.ses===1?'Trabajar':(s===1?'Redactar':(s===PP.ses?'Revisar':'Mejorar'));
    items.push({title:`Programación · ${verb}: ${p.t}`}); });
  if(days.length) items.forEach((x,i)=>{ x.day=days[items.length>1?Math.round(i*(days.length-1)/(items.length-1)):0]; });
  const seen=new Set(S.tasks.map(x=>x.due+'|'+x.title));
  return {items:items.filter(x=>x.day&&!seen.has(x.day+'|'+x.title)),days,pend};
}
let progProp=null;
function progPlanAsk(){
  const p=progPlan(); progProp=p;
  sheet(`<h3>🪄 Repartir la programación</h3>
  <p class="hint">Crea sesiones de 60 min en tu calendario: primero redactas todos los apartados pendientes y luego los revisas.</p>
  <label class="f">Terminarla el</label><input type="date" value="${S.opo.progDate||''}" onchange="S.opo.progDate=this.value;save();progPlanAsk()">
  <div class="two-col"><div><label class="f">Sesiones por apartado</label><select onchange="PP.ses=+this.value;progPlanAsk()">${[1,2,3].map(n=>`<option value="${n}" ${PP.ses===n?'selected':''}>${n}</option>`).join('')}</select></div>
   <div><label class="f">Fines de semana</label><select onchange="PP.fin=this.value==='1';progPlanAsk()"><option value="0" ${PP.fin?'':'selected'}>No</option><option value="1" ${PP.fin?'selected':''}>Sí</option></select></div></div>
  <div class="hint" style="margin:10px 0">${!S.opo.progDate?'Elige una fecha para poder repartir.':(p.items.length?`${p.items.length} sesiones entre el ${fmtDate(p.days[0])} y el ${fmtDate(p.days[p.days.length-1])} (${p.pend.length} apartados pendientes).`:'No hay nada que crear (todo terminado, ya está en el calendario o la fecha es hoy).')}</div>
  <div style="max-height:34vh;overflow:auto">${p.items.slice(0,40).map(x=>`<div class="task" style="padding:5px 4px"><div class="body"><div class="tt" style="font-size:.9rem">${esc(x.title)}</div><div class="meta"><span>${fmtDate(x.day)}</span></div></div></div>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Cerrar</button><span class="spacer"></span>${p.items.length?`<button class="btn" onclick="progPlanApply()">Crear ${p.items.length} sesiones</button>`:''}</div>`);
}
function progPlanApply(){
  const p=progProp; if(!p||!p.items.length) return;
  p.items.forEach(x=>S.tasks.push({id:uid(),area:'oposicion',block:'prog',title:x.title,due:x.day,time:'',mins:60,prio:2,done:false,notes:'Plan automático de programación',sub:[],repeat:'',created:Date.now()}));
  const n=p.items.length, first=p.items[0].day; progProp=null; save(); closeSheet();
  calMode='mes'; calSel=first; calMonth=first.slice(0,7); go('cal'); celebrate(); toast(`✅ ${n} sesiones de programación en tu calendario`);
}

function temaGroups(){
  const o=S.opo, n=o.temas.length, gs=(o.bloques||[]).map(b=>({...b,from:Math.max(1,b.from|0),to:Math.min(n,b.to|0)})).filter(b=>b.from<=b.to).sort((a,b)=>a.from-b.from);
  const covered=new Set(); gs.forEach(g=>{ for(let i=g.from;i<=g.to;i++) covered.add(i); });
  const rest=[]; for(let i=1;i<=n;i++) if(!covered.has(i)) rest.push(i);
  if(rest.length) gs.push({id:'_r',name:'Sin bloque',from:rest[0],to:rest[rest.length-1]});
  return gs;
}
function temaBloque(n){ return (S.opo.bloques||[]).find(b=>n>=b.from&&n<=b.to)?.name||''; }
function editBloques(){
  const L=S.opo.bloques;
  sheet(`<h3>Bloques del temario</h3><p class="hint">Pon el nombre de cada bloque y qué temas incluye (del … al …).</p>
  ${L.map((b,i)=>`<div style="border-bottom:1px solid var(--line);padding:8px 0"><input type="text" data-bn="${i}" value="${esc(b.name)}">
   <div class="row" style="margin-top:6px"><span class="hint">Del tema</span><input type="number" data-bf="${i}" value="${b.from}" style="max-width:80px"><span class="hint">al</span><input type="number" data-bt="${i}" value="${b.to}" style="max-width:80px"><span class="spacer"></span><button class="x" onclick="readBloques();S.opo.bloques.splice(${i},1);editBloques()">✕</button></div></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn soft" onclick="readBloques();const l=S.opo.bloques;const f=(l.length?l[l.length-1].to:0)+1;l.push({id:uid(),name:'Nuevo bloque',from:f,to:S.opo.temas.length});editBloques()">＋ Bloque</button><span class="spacer"></span>
  <button class="btn" onclick="readBloques();save();closeSheet();render()">Guardar</button></div>`);
}
function readBloques(){ document.querySelectorAll('[data-bn]').forEach(el=>{ const i=+el.dataset.bn, b=S.opo.bloques[i]; b.name=el.value.trim()||b.name; b.from=+$(`[data-bf="${i}"]`).value||1; b.to=+$(`[data-bt="${i}"]`).value||b.from; }); }
function resizeTemas(n){ n=Math.max(1,Math.min(120,n||75)); const a=S.opo.temas; while(a.length<n) a.push({n:a.length+1,title:'',st:0,reps:0,next:''}); a.length=n; save(); render(); }
function openTema(i){
  const x=S.opo.temas[i];
  sheet(`<h3>Tema ${x.n}</h3>${temaBloque(x.n)?`<div class="hint">${esc(temaBloque(x.n))}</div>`:''}<label class="f">Título</label><input type="text" id="tm_t" value="${esc(x.title)}" placeholder="Título del tema">
  <label class="f">Estado</label><div class="prio" style="flex-wrap:wrap">${ST_N.map((l,k)=>`<button class="${x.st===k?'on':''}" onclick="setTemaSt(${i},${k})">${l}</button>`).join('')}</div>
  <p class="hint" style="margin-top:10px">${x.next?`Próximo repaso: <b>${fmtDate(x.next)}</b> · repasos hechos: ${x.reps}`:'Sin repasos programados.'}</p>
  <div class="row" style="margin-top:8px"><button class="btn small soft" onclick="saveTemaTitle(${i});repasar(${i})">✓ Repasado hoy</button>
  <button class="btn small soft" onclick="saveTemaTitle(${i});toggleSel(${x.n});openTema(${i})">${selTemas().includes(x.n)?'★ Quitar de mis temas':'☆ Añadir a mis temas'}</button>
  <button class="btn small soft" onclick="saveTemaTitle(${i});closeSheet();quickStudy(${i})">🎯 Estudiar ahora</button>
  <button class="btn small soft" onclick="saveTemaTitle(${i});closeSheet();openTask(null,{area:'oposicion',block:'tem',title:'Tema ${x.n}: '})">＋ Tarea</button></div>
  <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn" onclick="saveTemaTitle(${i});closeSheet();render()">Hecho</button></div>`);
}
function saveTemaTitle(i){ const el=$('#tm_t'); if(el){ S.opo.temas[i].title=el.value.trim(); save(); } }
function setTemaSt(i,k){ saveTemaTitle(i); const x=S.opo.temas[i]; x.st=k; if(k>=3 && !x.next){ x.next=addDays(today(),INTERVALS[0]); } if(k<3){ x.next=''; x.reps=0; } save(); openTema(i); }
function repasar(i){ const x=S.opo.temas[i]; x.reps=(x.reps||0)+1; x.next=addDays(today(),INTERVALS[Math.min(x.reps,INTERVALS.length-1)]); if(x.st<3) x.st=3; if(x.reps>=4) x.st=4;
  const g=S.goals.find(g=>/repas/i.test(g.text)); if(g){ const wk=weekKey(); g.prog[wk]=(g.prog[wk]||0)+1; }
  save(); closeSheet(); render(); toast(`Tema ${x.n} repasado. Próximo: ${fmtDate(x.next)}`); }
function quickStudy(i){ const x=S.opo.temas[i];
  const id=uid(); S.tasks.push({id,area:'oposicion',block:'tem',title:`Estudiar Tema ${x.n}${x.title?': '+x.title:''}`,due:today(),time:'',mins:S.settings.work,prio:2,done:false,notes:'',sub:[{t:'Leer y subrayar',d:false},{t:'Esquema',d:false},{t:'Recitar sin mirar',d:false}],repeat:'',created:Date.now()});
  startFocusTask(id); }
const IST=['Pendiente','En curso','Terminada'];
function vInterv(){
  const L=S.opo.intervs;
  return `<div class="card"><h2>Intervenciones <span class="sub">${L.filter(x=>x.st===2).length}/${L.length} terminadas</span></h2>
  <p class="hint">Cada intervención tiene su carpeta de fuentes: documentos, enlaces y notas.</p>
  ${L.map((x,i)=>`<div class="task"><span class="pill" style="background:${['#efece6','#ece8fa','#dff2e6'][x.st]};color:${['#8b8678','var(--oposicion)','var(--green)'][x.st]};min-width:84px;justify-content:center;cursor:pointer" onclick="S.opo.intervs[${i}].st=(S.opo.intervs[${i}].st+1)%3;if(S.opo.intervs[${i}].st===2)celebrate();save();render()">${IST[x.st]}</span>
   <div class="body" onclick="openInterv(${i})"><div class="tt">${x.n}. ${esc(x.title||'Intervención '+x.n)}</div><div class="meta"><span>📁 ${x.fuentes.length} fuente${x.fuentes.length===1?'':'s'}</span>${x.notes?'<span>📝 notas</span>':''}</div></div>
   <button class="focusbtn" onclick="openInterv(${i})">Abrir</button></div>`).join('')}
  <div class="row" style="margin-top:10px"><button class="btn small soft" onclick="S.opo.intervs.push({id:uid(),n:S.opo.intervs.length+1,title:'',st:0,notes:'',fuentes:[]});save();render()">＋ Intervención</button></div></div>`;
}
let curInterv=null;
function openInterv(i){
  curInterv=i; const x=S.opo.intervs[i];
  const ic={file:'📄',link:'🔗',nota:'📝'};
  sheet(`<h3>Intervención ${x.n}</h3>
  <label class="f">Título</label><input type="text" id="iv_t" value="${esc(x.title)}" placeholder="Ej.: Programa de transición Infantil–Primaria">
  <label class="f">Estado</label><div class="prio">${IST.map((l,k)=>`<button class="${x.st===k?'on':''}" onclick="ivSave();S.opo.intervs[${i}].st=${k};save();openInterv(${i})">${l}</button>`).join('')}</div>
  <label class="f">Notas / guion</label><textarea id="iv_n" placeholder="Justificación, objetivos, actuaciones, evaluación…">${esc(x.notes)}</textarea>
  <label class="f">📁 Carpeta de fuentes (${x.fuentes.length})</label>
  ${x.fuentes.length? x.fuentes.map((f,k)=>`<div class="inbox-item"><span>${ic[f.type]||'•'}</span><span class="tx">${f.url?`<a class="link" target="_blank" rel="noopener" href="${esc(f.url)}">${esc(f.title)}</a>`:esc(f.title)}${f.type==='nota'&&f.text?`<div class="hint">${esc(f.text)}</div>`:''}</span><button class="x" onclick="ivSave();delFuente(${i},${k})">✕</button></div>`).join('') : '<div class="empty">Carpeta vacía.</div>'}
  <div style="background:#f6f4ef;border-radius:12px;padding:10px;margin-top:8px">
   <div class="row"><label class="btn small soft" style="cursor:pointer">📄 Subir archivo<input type="file" id="iv_file" style="display:none" accept=".pdf,.png,.jpg,.jpeg,.txt,.md,.csv,.json" onchange="ivSave();upFuente(${i},this)"></label><span class="hint" id="iv_up">PDF, imagen o texto (máx. 20 MB)</span></div>
   <div class="addline"><input type="text" id="iv_lt" placeholder="Nombre del enlace (normativa, Drive, artículo…)"></div>
   <div class="addline"><input type="text" id="iv_lu" placeholder="https://…"><button class="btn small" onclick="ivSave();addLink(${i})">🔗 Añadir</button></div>
   <div class="addline"><input type="text" id="iv_nt" placeholder="Referencia o cita (autor, año, ley…)"><button class="btn small soft" onclick="ivSave();addNota(${i})">📝 Añadir</button></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn small soft" onclick="ivSave();closeSheet();openTask(null,{area:'oposicion',block:'interv',title:'Intervención ${x.n}: '})">＋ Tarea</button>
   <button class="btn small soft" onclick="ivSave();ivFocus(${i})">🎯 Trabajar ahora</button>
   <span class="spacer"></span><button class="btn danger small" onclick="S.opo.intervs.splice(${i},1);S.opo.intervs.forEach((v,k)=>v.n=k+1);save();closeSheet();render()">Borrar</button></div>
  <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" onclick="ivSave();closeSheet();render()">Hecho</button></div>`);
}
function ivSave(){ const x=S.opo.intervs[curInterv]; if(!x||!$('#iv_t')) return; x.title=$('#iv_t').value.trim(); x.notes=$('#iv_n').value; save(); }
function addLink(i){ let u=$('#iv_lu').value.trim(); if(!u) return; if(!/^https?:\/\//i.test(u)) u='https://'+u; S.opo.intervs[i].fuentes.push({id:uid(),type:'link',title:$('#iv_lt').value.trim()||u,url:u}); save(); openInterv(i); }
function addNota(i){ const t=$('#iv_nt').value.trim(); if(!t) return; S.opo.intervs[i].fuentes.push({id:uid(),type:'nota',title:t}); save(); openInterv(i); }
function delFuente(i,k){ const f=S.opo.intervs[i].fuentes[k]; S.opo.intervs[i].fuentes.splice(k,1); save(); openInterv(i);
  toast('Fuente quitada',{label:'Deshacer',fn:()=>{ S.opo.intervs[i].fuentes.splice(k,0,f); save(); openInterv(i); }}); }
async function upFuente(i,inp){
  const file=inp.files[0]; if(!file) return; const m=$('#iv_up'); m.textContent='Subiendo…';
  try{
    const assets = window.claude? await claude.use('assets') : null;
    if(!assets) throw 0;
    const r=await assets.upload(file);
    S.opo.intervs[i].fuentes.push({id:uid(),type:'file',title:file.name,url:r.url||('/_blob/'+r.id),assetId:r.id}); save(); openInterv(i); toast('Archivo guardado en la carpeta');
  }catch(e){ m.textContent='No se pudo subir aquí. Súbelo a Google Drive y añade su enlace.'; }
}
function ivFocus(i){ const x=S.opo.intervs[i]; const id=uid();
  S.tasks.push({id,area:'oposicion',block:'interv',title:`Intervención ${x.n}${x.title?': '+x.title:''}`,due:today(),time:'',mins:S.settings.work,prio:2,done:false,notes:'',sub:[],repeat:'',created:Date.now()});
  startFocusTask(id); }
function vSup(){
  const L=S.opo.supuestos; const notas=L.filter(s=>s.nota!==''&&s.nota!=null).map(s=>+s.nota); const avg=notas.length?(notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(1):'—';
  return `<div class="card"><h2>Supuestos prácticos <span class="sub">${L.length} hechos · media ${avg}</span></h2>
  <div class="two-col"><div><label class="f">Tema / caso</label><input type="text" id="s_t" placeholder="Ej.: Alumno con TEA en 3º EP"></div>
   <div><label class="f">Fecha</label><input type="date" id="s_d" value="${today()}"></div></div>
  <div class="two-col"><div><label class="f">Tiempo empleado (min)</label><input type="number" id="s_m" min="0"></div><div><label class="f">Nota autoevaluada (0–10)</label><input type="number" id="s_n" min="0" max="10" step="0.5"></div></div>
  <label class="f">Qué mejorar</label><input type="text" id="s_o" placeholder="Normativa, estructura, tiempo…">
  <button class="btn full" style="margin-top:10px" onclick="addSup()">Registrar supuesto</button></div>

/* ---- NotebookLM vía Google Drive ---- */
function opoMarkdown(){
  const o=S.opo; const t=today();
  let md=`# Oposición Orientación Educativa — estado de preparación\nActualizado: ${t}\n`;
  if(o.examDate) md+=`Examen (1ª parte): ${o.examDate} (faltan ${daysBetween(t,o.examDate)} días)\n`;
  if(o.exam2Date) md+=`Exposición (2ª parte): antes de ${o.exam2Date}\n`;
  md+=`\n## Temario\n`;
  o.temas.forEach(x=>{ md+=`- ${temaBloque(x.n)?'['+temaBloque(x.n)+'] ':''}Tema ${x.n}${x.title?': '+x.title:''} — ${ST_N[x.st]}${x.reps?`, ${x.reps} repasos`:''}${x.next?`, próximo repaso ${x.next}`:''}\n`; });
  md+=`\n## Intervenciones\n`;
  o.intervs.forEach(x=>{ md+=`### ${x.n}. ${x.title||'Intervención '+x.n} (${['pendiente','en curso','terminada'][x.st]})\n`; if(x.notes) md+=x.notes+'\n';
    if(x.fuentes.length){ md+='Fuentes:\n'; x.fuentes.forEach(f=>{ md+=`- ${f.title}${f.url&&f.type==='link'?' — '+f.url:''}${f.type==='file'?' (archivo adjunto en la app)':''}\n`; }); } });
  md+=`\n## Programación\n`; o.prog.forEach(p=>{ md+=`- ${p.t}: ${['pendiente','en curso','terminada'][p.st]}\n`; });
  md+=`\n## Supuestos prácticos realizados\n`; o.supuestos.forEach(s=>{ md+=`- ${s.d} · ${s.t}${s.m?` · ${s.m} min`:''}${s.nota!==''?` · nota ${s.nota}`:''}${s.o?` · mejorar: ${s.o}`:''}\n`; });
  md+=`\n## Ensayos orales\n`; o.orales.forEach(s=>{ md+=`- ${s.d} · ${s.ty}${s.t?' · '+s.t:''}${s.m?` · ${s.m} min`:''}${s.n?` · notas: ${s.n}`:''}\n`; });
  const ts=S.tasks.filter(x=>x.area==='oposicion');
  md+=`\n## Tareas de oposición pendientes\n`; ts.filter(x=>!x.done).forEach(x=>{ md+=`- [${blockName('oposicion',x.block)}] ${x.title}${x.due?` (para ${x.due})`:''}${x.notes?` — ${x.notes.replace(/\n/g,' ')}`:''}\n`; });
  md+=`\n## Notas de tareas terminadas\n`; ts.filter(x=>x.done&&x.notes).forEach(x=>{ md+=`- ${x.title}: ${x.notes.replace(/\n/g,' ')}\n`; });
  return md;
}

  <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Ver el contenido que se enviará</summary><pre style="white-space:pre-wrap;font-size:.8rem;background:#f4f2ec;padding:10px;border-radius:10px">${esc(opoMarkdown())}</pre></details></div>`;

async function sendDrive(){
  const msg=$('#drvmsg'), b=$('#drvbtn'); b.disabled=true; b.textContent='Enviando…';
  try{
    const mcp = window.claude? await claude.use('mcp') : null;
    if(!mcp){ await shareFiles([new File([opoMarkdown()],`Oposicion_progreso_${today()}.md`,{type:'text/markdown'})],'Oposición – progreso'); msg.innerHTML='Elige «Drive» en el menú para guardarlo y añádelo después como fuente en NotebookLM.'; b.disabled=false; b.textContent='☁️ Enviar a Google Drive'; return; }
    const res = await mcp.callTool('Google Drive','create_file',{title:`Oposición – progreso (${today()})`, textContent:opoMarkdown(), contentMimeType:'text/markdown'});
    const p = res && (res.payload||res) || {};
    const f = p.file||p;
    const link = f.webViewLink || f.alternateLink || f.url || (f.id?`https://docs.google.com/document/d/${f.id}/edit`:'');
    S.drive={last:today(),link}; save();
    msg.innerHTML = `✅ Documento creado en tu Drive${link?` · <a class="link" target="_blank" rel="noopener" href="${esc(link)}">abrir</a>`:''}. Ahora añádelo como fuente en NotebookLM.`;
    celebrate();
  }catch(e){
    const c=e&&e.code;
    msg.innerHTML = c==='server_not_connected' ? '⚠️ Google Drive no está conectado a tu cuenta de Claude. Conéctalo en los ajustes de conectores de claude.ai o usa «Copiar texto».'
      : '⚠️ No se pudo enviar a Drive desde aquí. Usa «Copiar texto» y pégalo en un Google Doc o directamente como fuente de texto en NotebookLM.';
  }
  b.disabled=false; b.textContent='☁️ Enviar a Google Drive';
}
