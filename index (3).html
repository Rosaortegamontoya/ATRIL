/* --- audios --- */
const audURL={};
async function reuAudios(r){
  const c=$('#reu_audios'); if(!c) return; Object.values(audURL).forEach(u=>URL.revokeObjectURL(u));
  if(!r.audios.length){ c.innerHTML=''; return; }
  c.innerHTML=r.audios.map(a=>`<div class="aud" data-a="${a.id}"><div class="row"><b style="flex:1">${esc(a.nombre)}</b><span class="hint">${a.dur?hms(a.dur):''}</span></div>
    <audio controls preload="metadata"></audio>
    <div class="row"><button class="btn small soft" onclick="audShare('${r.id}','${a.id}')">📤 Compartir audio</button><button class="btn small ghost" onclick="audDel('${r.id}','${a.id}')">🗑️</button></div></div>`).join('');
  for(const a of r.audios){ try{ const x=await aGet(a.id); const el=c.querySelector(`[data-a="${a.id}"] audio`); if(x&&el){ audURL[a.id]=URL.createObjectURL(x.blob); el.src=audURL[a.id]; } else if(el){ el.replaceWith(Object.assign(document.createElement('div'),{className:'hint',textContent:'Audio guardado en otro dispositivo.'})); } }catch(e){} }
}
async function addAudio(r, blob, nombre, dur){ const id=uid(); await aPut({id,blob}); r.audios.push({id,nombre,dur:Math.round(dur||0),mime:blob.type}); save(); }
async function reuImport(id, inp){ const f=inp.files[0]; if(!f) return; const r=reuById(id); await addAudio(r,f,f.name.replace(/\.[^.]+$/,''),0); render(); toast('Audio añadido'); }
const extDe = m => /mp4|m4a|aac/.test(m)?'m4a':/ogg/.test(m)?'ogg':/mpeg|mp3/.test(m)?'mp3':/wav/.test(m)?'wav':'webm';
function fname(r, ext, extra){ const b=((r.fecha||'')+' '+(r.titulo||'reunion')+(extra?' '+extra:'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,70); return (b||'reunion')+'.'+ext; }
async function audFile(r,a){ const x=await aGet(a.id); if(!x) return null; const m=x.blob.type||a.mime||'audio/webm'; return new File([x.blob], fname(r,extDe(m),a.nombre), {type:m}); }
async function audShare(rid,aid){ const r=reuById(rid), a=r.audios.find(x=>x.id===aid); const f=await audFile(r,a); if(f) shareFiles([f], a.nombre); else toast('Este audio no está en este dispositivo'); }
function audDel(rid,aid){ sheet(`<h3>¿Eliminar este audio?</h3><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><span class="spacer"></span><button class="btn danger" onclick="audDelOk('${rid}','${aid}')">Eliminar</button></div>`); }
async function audDelOk(rid,aid){ const r=reuById(rid); try{ await aDel(aid); }catch(e){} r.audios=r.audios.filter(x=>x.id!==aid); save(); closeSheet(); render(); }

/* --- GRABACIÓN + TRANSCRIPCIÓN EN DIRECTO --- */
const REC={reuId:null,mr:null,stream:null,chunks:[],t0:0,acc:0,sr:null,live:false,liveFail:'',wake:null,timer:null};
const recSecs = () => REC.acc + (REC.mr && REC.mr.state==='recording' ? (Date.now()-REC.t0)/1000 : 0);
function recStateTxt(){ if(REC.mr&&REC.mr.state==='paused') return '⏸ En pausa.';
  if(REC.live) return '🟢 Grabando y pasando a texto. Deja el móvil cerca de quien habla.';
  return '🔴 Grabando audio.'+(REC.liveFail?' '+REC.liveFail:''); }
function mimeAudio(){ for(const m of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; return ''; }
async function recStart(id){
  const r=reuById(id); if(!r || REC.reuId) return;
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Este navegador no permite grabar. Usa Chrome.');
  if(!r.aviso){ sheet(`<h3>¿Has avisado de la grabación?</h3><p class="hint">Antes de grabar conviene informar a las personas asistentes (protección de datos).</p>
     <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><span class="spacer"></span><button class="btn recbtn" onclick="reuById('${id}').aviso=true;save();closeSheet();recStart('${id}')">Sí, grabar</button></div>`); return; }
  try{ REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ return toast('Sin permiso de micrófono. Actívalo en los ajustes del navegador.'); }
  const mime=mimeAudio(); REC.mr=new MediaRecorder(REC.stream, mime?{mimeType:mime}:undefined); REC.chunks=[]; REC.acc=0; REC.reuId=id; REC.liveFail='';
  REC.mr.ondataavailable=e=>{ if(e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=recSaved;
  REC.mr.start(5000); REC.t0=Date.now();
  try{ REC.wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  if(SRec && S.settings.liveTrans!==false) liveStart();
  REC.timer=setInterval(recTick,500); recTick(); render(); toast('● Grabando');
}
function liveStart(){
  try{
    const sr=new SRec(); sr.lang='es-ES'; sr.continuous=true; sr.interimResults=true; REC.sr=sr;
    sr.onresult=ev=>{ let interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){ const res=ev.results[i], txt=res[0].transcript.trim(); if(!txt) continue;
        if(res.isFinal){ const r=reuById(REC.reuId); if(!r) continue; const line=`[${hms(recSecs())}] ${txt.charAt(0).toUpperCase()+txt.slice(1)}`;
          r.trans=(r.trans?r.trans.replace(/\s*$/,'')+'\n':'')+line; reuSave();
          const ta=$('#r_trans'); if(ta && curReu===r.id){ const atEnd=ta.scrollTop+ta.clientHeight>=ta.scrollHeight-30; ta.value=r.trans; if(atEnd) ta.scrollTop=ta.scrollHeight; } }
        else interim+=txt+' '; }
      const im=$('#rec_interim'); if(im) im.textContent=interim; };
    sr.onerror=ev=>{ if(['audio-capture','not-allowed','service-not-allowed','network'].includes(ev.error)){ REC.live=false; REC.sr=null;
      REC.liveFail= ev.error==='network' ? 'La transcripción en directo necesita internet; el audio se sigue grabando.' : 'Este dispositivo no deja grabar y transcribir a la vez; el audio se sigue grabando. Luego pásalo a texto con NotebookLM.'; recTick(); } };
    sr.onend=()=>{ if(REC.sr===sr && REC.mr && REC.mr.state==='recording'){ try{ sr.start(); }catch(e){} } };
    sr.start(); REC.live=true;
  }catch(e){ REC.live=false; }
}
function liveStop(){ const sr=REC.sr; REC.sr=null; REC.live=false; if(sr){ try{ sr.stop(); }catch(e){} } const im=$('#rec_interim'); if(im) im.textContent=''; }
function recTick(){
  const on=!!REC.reuId, r=on&&reuById(REC.reuId), bar=$('#recbar');
  if(bar){ bar.style.display=on?'flex':'none';
    if(on) bar.innerHTML=`<span class="recdot ${REC.mr&&REC.mr.state==='paused'?'paused':''}"></span><b>${hms(recSecs())}</b><span class="rt">${esc(r?.titulo||'Reunión')}</span>
      ${curReu===REC.reuId&&view==='reun'?'':`<button onclick="openReu('${REC.reuId}')">Ver</button>`}<button onclick="recPause()">${REC.mr&&REC.mr.state==='paused'?'▶':'⏸'}</button><button onclick="recStop()">■</button>`; }
  const c=$('#rec_clock'); if(c&&on) c.textContent='● '+hms(recSecs());
  const s=$('#rec_state'); if(s) s.textContent=recStateTxt();
  document.body.classList.toggle('recording',on);
}
function recPause(){ if(!REC.mr) return;
  if(REC.mr.state==='recording'){ REC.acc+=(Date.now()-REC.t0)/1000; REC.mr.pause(); liveStop(); }
  else { REC.t0=Date.now(); REC.mr.resume(); if(SRec && S.settings.liveTrans!==false && !REC.liveFail) liveStart(); }
  render(); recTick(); }
function recMark(){ const r=reuById(REC.reuId); if(!r) return; const m=`[📌 ${hms(recSecs())}] `;
  r.notas=(r.notas&&!r.notas.endsWith('\n')?r.notas+'\n':(r.notas||''))+m; save();
  const n=$('#r_notas'); if(n){ n.value=r.notas; n.focus(); n.setSelectionRange(n.value.length,n.value.length); } toast('Marca en tus notas'); }
function recStop(){ if(!REC.mr) return; if(REC.mr.state==='recording') REC.acc+=(Date.now()-REC.t0)/1000; liveStop(); REC.mr.stop(); }
async function recSaved(){
  clearInterval(REC.timer); REC.stream.getTracks().forEach(t=>t.stop()); try{ REC.wake&&REC.wake.release(); }catch(e){}
  const r=reuById(REC.reuId); const type=(REC.mr.mimeType||'audio/webm').split(';')[0]; const blob=new Blob(REC.chunks,{type});
  const dur=REC.acc; Object.assign(REC,{reuId:null,mr:null,stream:null,chunks:[],acc:0});
  if(r){ await addAudio(r, blob, 'Grabación '+(r.audios.length+1), dur); }
  recTick(); render(); toast('✅ Audio y texto guardados'); celebrate();
}
window.addEventListener('beforeunload',e=>{ if(REC.reuId){ e.preventDefault(); e.returnValue=''; } });

/* --- dictado manual en un campo --- */
let dsr=null;
function dictar(id, btn){
  if(dsr){ const same=dsr._id===id; try{ dsr.stop(); }catch(e){} dsr=null; if(same) return; }
  const ta=$('#'+id); if(!ta||!SRec) return; const sr=new SRec(); sr.lang='es-ES'; sr.continuous=true; sr.interimResults=false; sr._id=id; dsr=sr;
  sr.onresult=ev=>{ for(let i=ev.resultIndex;i<ev.results.length;i++) if(ev.results[i].isFinal){ let t=ev.results[i][0].transcript.trim(); if(!t) continue;
    t=t.replace(/\s*(punto y aparte|nueva línea|nuevo párrafo)\s*/gi,'.\n').replace(/\s+punto\b/gi,'.').replace(/\s+coma\b/gi,',');
    const el=$('#'+id); if(!el) continue; const v=el.value; el.value=v+(!v||/\n$/.test(v)?'':' ')+t.charAt(0).toUpperCase()+t.slice(1); el.dispatchEvent(new Event('input')); } };
  sr.onend=()=>{ if(dsr===sr) dsr=null; document.querySelectorAll('.dict').forEach(b=>{ b.classList.remove('on'); b.textContent='🎤 Dictar'; }); };
  try{ sr.start(); btn.classList.add('on'); btn.textContent='⏹ Parar'; toast('Habla. Di «punto y aparte» para cambiar de línea.'); }catch(e){ toast('No se pudo iniciar el dictado'); }
}

/* --- textos de resultado --- */
const lns = t => (t||'').split('\n').map(s=>s.trim()).filter(Boolean);
function reuMd(r){
  const L=[`# ${r.titulo||'Reunión'}`,'',`**Tipo:** ${REU_TIPOS[r.tipo]?.n||''}  `,`**Fecha:** ${fmtDate(r.fecha)} ${r.fecha}${r.hora?' · '+r.hora:''}  `];
  if(r.lugar) L.push(`**Lugar:** ${r.lugar}  `);
  if(r.asistentes.length) L.push('','## Asistentes',...r.asistentes.map(a=>'- '+a));
  if(r.orden.trim()) L.push('','## Orden del día',...lns(r.orden));
  if(r.notas.trim()) L.push('','## Notas',r.notas.trim());
  if(r.acuerdos.trim()) L.push('','## Acuerdos',...lns(r.acuerdos).map(a=>'- '+a.replace(/^[-•·]\s*/,'')));
  const ts=reuTasks(r); if(ts.length) L.push('','## Tareas',...ts.map(t=>`- [${t.done?'x':' '}] ${t.title}${t.due?' ('+fmtDate(t.due)+')':''}`));
  if((r.trans||'').trim()) L.push('','## Transcripción',r.trans.trim());
  return L.join('\n');
}
function reuWA(r){
  const L=[`*${r.titulo||'Reunión'}*`,`📅 ${fmtDate(r.fecha)}${r.hora?' · '+r.hora:''}`]; if(r.lugar) L.push('📍 '+r.lugar); if(r.asistentes.length) L.push('👥 '+r.asistentes.join(', '));
  if(r.acuerdos.trim()) L.push('','*Acuerdos*',...lns(r.acuerdos).map(a=>'• '+a.replace(/^[-•·]\s*/,'')));
  const p=reuTasks(r).filter(t=>!t.done); if(p.length) L.push('','*Tareas*',...p.map(t=>`☐ ${t.title}${t.due?' ('+fmtDate(t.due)+')':''}`));
  if(!r.acuerdos.trim()&&!p.length&&r.notas.trim()) L.push('',r.notas.trim().slice(0,1500));
  return L.join('\n');
}
const pdfTxt = t => String(t).replace(/📌\s*/g,'').replace(/[^\x00-\xFF—–•…“”‘’€]/gu,'').replace(/ {2,}/g,' ');
function reuPDF(r){
  if(!window.jspdf){ toast('Falta el generador de PDF: abre la app una vez con internet.'); return null; }
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210,M=18,AN=W-2*M; let y=20;
  const brk=h=>{ if(y+h>280){ doc.addPage(); y=20; } };
  const txt=(t,sz=10.5,st='normal',col=[36,34,42])=>{ doc.setFont('helvetica',st); doc.setFontSize(sz); doc.setTextColor(...col);
    doc.splitTextToSize(pdfTxt(t),AN).forEach(l=>{ brk(sz*.5); doc.text(l,M,y); y+=sz*.45; }); };
  const h2=t=>{ y+=4; brk(12); doc.setFillColor(226,243,240); doc.rect(M,y-5,AN,8,'F'); txt(t,12,'bold',[20,137,122]); y+=2; };
  txt('ACTA / NOTAS DE REUNIÓN',9,'normal',[111,107,120]); y+=2; txt(r.titulo||'Reunión',17,'bold'); y+=1;
  doc.setDrawColor(20,137,122); doc.setLineWidth(.6); doc.line(M,y,W-M,y); y+=6;
  [['Tipo',REU_TIPOS[r.tipo]?.n],['Fecha',new Date(r.fecha+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(r.hora?' · '+r.hora:'')],['Lugar',r.lugar]].forEach(([k,v])=>{ if(v) txt(k+': '+v); });
  if(r.asistentes.length){ h2('Asistentes'); txt(r.asistentes.join(' · ')); }
  if(r.orden.trim()){ h2('Orden del día'); lns(r.orden).forEach(l=>txt(l)); }
  if(r.notas.trim()){ h2('Desarrollo / Notas'); r.notas.trim().split('\n').forEach(l=>l.trim()?txt(l):(y+=2)); }
  if(r.acuerdos.trim()){ h2('Acuerdos'); lns(r.acuerdos).forEach((a,i)=>txt((i+1)+'. '+a.replace(/^[-•·]\s*/,''))); }
  const ts=reuTasks(r); if(ts.length){ h2('Tareas y seguimiento'); ts.forEach(t=>txt(`${t.done?'[x]':'[  ]'} ${t.title}${t.due?' ('+fmtDate(t.due)+')':''}`)); }
  if(r.audios.length){ h2('Grabaciones'); r.audios.forEach(a=>txt('• '+a.nombre+(a.dur?' ('+hms(a.dur)+')':''),10)); }
  if((r.trans||'').trim()){ h2('Transcripción'); r.trans.trim().split('\n').forEach(l=>l.trim()&&txt(l,9.5)); }
  if(r.aviso){ y+=4; txt('Se informó a las personas asistentes de la grabación.',9,'italic',[111,107,120]); }
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(pdfTxt((r.titulo||'Reunión')+' · '+r.fecha),M,290); doc.text(`Página ${i} de ${n}`,W-M,290,{align:'right'}); }
  return new File([doc.output('blob')], fname(r,'pdf'), {type:'application/pdf'});
}

/* --- compartir --- */
function dl(f){ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
async function shareFiles(files,title){
  if(navigator.canShare && navigator.canShare({files})){ try{ await navigator.share({files,title}); return; }catch(e){ if(e.name==='AbortError') return; } }
  files.forEach((f,i)=>setTimeout(()=>dl(f),i*400)); toast(files.length>1?'Archivos descargados':'Archivo descargado'); }
async function copyTxt(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; } }
function reuShareSheet(id){
  sheet(`<h3>📤 Resultados de la reunión</h3><p class="hint">En el móvil se abre el menú para elegir WhatsApp, Notion, Drive, correo… En el ordenador se descarga.</p>
  <div class="opc">
   <button class="btn soft" onclick="reuOut('${id}','pdf')">📄 Acta en PDF (con transcripción)</button>
   <button class="btn soft" onclick="reuOut('${id}','wa')">💬 Resumen para WhatsApp</button>
   <button class="btn soft" onclick="reuOut('${id}','notion')">🧩 Copiar para Notion</button>
   <button class="btn soft" onclick="reuOut('${id}','md')">⬇️ Archivo de texto (.md)</button>
   <button class="btn soft" onclick="reuOut('${id}','todo')">📦 PDF + todos los audios</button>
   <button class="btn ghost" onclick="closeSheet()">Cerrar</button></div>`); }
async function reuOut(id, k){
  const r=reuById(id); closeSheet();
  if(k==='pdf'){ const f=reuPDF(r); if(f) shareFiles([f],r.titulo); }
  if(k==='wa'){ const t=reuWA(r); if(navigator.share){ try{ await navigator.share({text:t}); return; }catch(e){ if(e.name==='AbortError') return; } }
    if(await copyTxt(t)) toast('Copiado: pégalo en WhatsApp'); window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); }
  if(k==='notion'){ toast(await copyTxt(reuMd(r))?'Copiado: pégalo en una página de Notion':'No se pudo copiar'); }
  if(k==='md') shareFiles([new File([reuMd(r)],fname(r,'md'),{type:'text/markdown'})], r.titulo);
  if(k==='todo'){ const fs=[]; const p=reuPDF(r); if(p) fs.push(p); for(const a of r.audios){ const f=await audFile(r,a); if(f) fs.push(f); } if(fs.length) shareFiles(fs,r.titulo); }
}

/* --- copia de seguridad (pasar datos entre móvil y ordenador) --- */
function openBackup(){
  sheet(`<h3>💾 Tus datos</h3><p class="hint">Esta app guarda todo en el dispositivo. Para pasar tus datos del móvil al ordenador (o al revés), haz una copia en un dispositivo, guárdala en Drive o envíatela, y restáurala en el otro.</p>
  <div class="opc">
   <button class="btn soft" onclick="backupOut(true)">💾 Copia de seguridad completa (con audios)</button>
   <button class="btn soft" onclick="backupOut(false)">💾 Copia ligera (sin audios)</button>
   <label class="btn soft" style="cursor:pointer">📥 Restaurar una copia<input type="file" accept=".json,application/json" style="display:none" onchange="backupIn(this)"></label>
   <details><summary class="hint" style="cursor:pointer;padding:6px 0">Traer mis datos de la versión de Mi Día dentro de Claude</summary>
    <p class="hint">En la versión de Claude, pulsa «Solo este dispositivo / Sincronizado» arriba a la derecha → «Copiar mis datos». Después pégalos aquí:</p>
    <textarea id="imp_txt" placeholder="Pega aquí los datos copiados"></textarea>
    <button class="btn" style="margin-top:8px" onclick="importPaste()">Importar</button></details>
   <button class="btn soft" onclick="closeSheet();instalarApp()">📲 Instalar la app en el móvil</button>
   <button class="btn ghost" onclick="closeSheet()">Cerrar</button></div>`); }
const toB64 = b => new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
async function backupOut(withAudio){ toast('Preparando copia…'); const audios=[];
  if(withAudio) for(const r of S.reuniones) for(const a of r.audios){ try{ const x=await aGet(a.id); if(x) audios.push({id:a.id,data:await toB64(x.blob)}); }catch(e){} }
  const f=new File([JSON.stringify({app:'midia',v:1,fecha:new Date().toISOString(),estado:S,audios})],`MiDia_copia_${today()}.json`,{type:'application/json'});
  shareFiles([f],'Copia de Mi Día'); }
async function applyImport(d){
  const st = d.estado || d; if(!st || !st.tasks || !st.blocks) throw 0;
  for(const a of d.audios||[]){ const blob=await (await fetch(a.data)).blob(); await aPut({id:a.id,blob}); }
  S=migrate(st); S.updatedAt=Date.now(); lsSet(S); closeSheet(); curReu=null; render(); toast('✅ Datos importados'); celebrate(); }
async function backupIn(inp){ const f=inp.files[0]; if(!f) return; try{ await applyImport(JSON.parse(await f.text())); }catch(e){ toast('Ese archivo no es una copia válida'); } }
async function importPaste(){ try{ await applyImport(JSON.parse($('#imp_txt').value.trim())); }catch(e){ toast('Lo pegado no son datos válidos de Mi Día'); } }

S = migrate(lsGet() || defaultState());
{ const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)) view=h; }
if(S.focus&&S.focus.running) view='foco';
render();
tick=setInterval(onTick,1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ onTick(); render(); } });
let lastDay=today(); setInterval(()=>{ if(today()!==lastDay){ lastDay=today(); render(); } },60000);
initCloud();
setInterval(()=>{ if(REC.reuId) recTick(); },1000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
