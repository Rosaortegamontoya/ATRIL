<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2033"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d585"/>
      <stop offset="0.5" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#c8901d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- arcos de voz -->
  <g fill="none" stroke="#e8b84b" stroke-width="15" stroke-linecap="round" opacity="0.9">
    <path d="M355 150 a54 54 0 0 1 0 92"/>
    <path d="M388 121 a104 104 0 0 1 0 150"/>
  </g>
  <!-- atril: tablero inclinado -->
  <g fill="url(#brass)">
    <path d="M150 168 l150 -30 a14 14 0 0 1 17 11 l10 52 a14 14 0 0 1 -11 16 l-150 30 a14 14 0 0 1 -17 -11 l-10 -52 a14 14 0 0 1 11 -16 z"/>
    <!-- mástil -->
    <rect x="243" y="214" width="26" height="150" rx="10"/>
    <!-- base -->
    <path d="M196 372 h120 a12 12 0 0 1 12 12 v8 a12 12 0 0 1 -12 12 h-120 a12 12 0 0 1 -12 -12 v-8 a12 12 0 0 1 12 -12 z"/>
    <ellipse cx="256" cy="418" rx="70" ry="14"/>
  </g>
  <!-- líneas de texto sobre el tablero -->
  <g stroke="#3a2f12" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <line x1="178" y1="188" x2="286" y2="167"/>
    <line x1="184" y1="212" x2="270" y2="195"/>
  </g>
</svg>
